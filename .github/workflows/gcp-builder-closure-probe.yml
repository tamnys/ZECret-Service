name: GCP pinned builder payload staging probe

on:
  workflow_dispatch:

permissions: {}

jobs:
  stage:
    name: Diagnostic locked payload staging and chroot tool startup
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch exact source commit and locked Debian payloads
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64

          source="$GITHUB_WORKSPACE/source"
          scratch="$GITHUB_WORKSPACE/builder-closure"
          mkdir "$source" "$scratch" "$scratch/archives"
          git -C "$source" init -q
          git -C "$source" fetch -q --no-tags --depth=1 \
            "https://github.com/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          test "$(git -C "$source" rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git -C "$source" checkout -q --detach FETCH_HEAD
          cd "$source"

          ZRPC_BUILDER_ARCHIVES="$scratch/archives" python3 -I - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys

          root = Path.cwd()
          sys.path.insert(0, str(root / "tools/gcp-guest"))
          import debian_snapshot
          import fetch_builder_closure
          import verify_builder_closure
          import verify_builder_packages

          lock_path = verify_builder_closure.LOCK
          lock_bytes = debian_snapshot.bounded_regular_bytes(
              lock_path, verify_builder_closure.LOCK_BYTES, "builder closure lock"
          )
          if (len(lock_bytes) != verify_builder_closure.LOCK_BYTES or
                  hashlib.sha256(lock_bytes).hexdigest() != verify_builder_closure.LOCK_SHA256):
              raise ValueError("builder closure differs from source-reviewed candidate")
          lock = json.loads(lock_bytes, object_pairs_hook=verify_builder_packages.unique_object)
          if (lock.get("schema_version") != 1 or
                  lock.get("status") != "apt-resolved-candidate-unbuilt-unapproved" or
                  lock.get("snapshot") !=
                  "https://snapshot.debian.org/archive/debian/20260918T000000Z/" or
                  not isinstance(lock.get("packages"), list) or not lock["packages"]):
              raise ValueError("unsupported builder closure")
          names = [entry.get("name") for entry in lock["packages"]]
          if names != sorted(set(names)):
              raise ValueError("builder closure package order differs from review")

          archives = Path(os.environ["ZRPC_BUILDER_ARCHIVES"])
          directory = os.open(
              archives, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW | os.O_CLOEXEC
          )
          try:
              for entry in lock["packages"]:
                  fetch_builder_closure.download_one(
                      directory, entry, lock["snapshot"]
                  )
                  if not fetch_builder_closure.verify_cached(directory, entry):
                      raise ValueError("locked builder archive missing after download")
          finally:
              os.close(directory)
          print(json.dumps({
              "status": "diagnostic-locked-builder-archives-fetched-unbuilt",
              "closure_lock_sha256": hashlib.sha256(lock_bytes).hexdigest(),
              "package_count": len(lock["packages"]),
              "signed_snapshot_rechecked": False,
              "package_scripts_executed": False,
              "runtime_execution_verified": False,
              "complete_builder_toolchain": False,
              "image_built": False,
              "private_mode_approved": False,
          }, sort_keys=True))
          PY

          CODEX_WORKSPACE_DIR="$GITHUB_WORKSPACE" \
            python3 tools/gcp-guest/stage_builder_toolchain.py \
              --archives "$scratch/archives" --output "$scratch/staged"
          python3 - "$scratch/staged/.zrpc-builder-toolchain.json" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          data = path.read_bytes()
          report = json.loads(data)
          if (report["status"] != "diagnostic-builder-payloads-staged-unbuilt" or
                  report["package_count"] != 199 or
                  report["signed_snapshot_rechecked"] is not False or
                  report["package_scripts_executed"] is not False or
                  report["runtime_execution_verified"] is not False or
                  report["complete_builder_toolchain"] is not False or
                  report["image_built"] is not False or
                  report["private_mode_approved"] is not False):
              raise ValueError("staging diagnostic changed acceptance status")
          print(json.dumps({
              "status": report["status"],
              "manifest_sha256": hashlib.sha256(data).hexdigest(),
              "package_count": report["package_count"],
              "entry_count": len(report["entries"]),
              "runtime_execution_verified": False,
              "image_built": False,
              "private_mode_approved": False,
          }, sort_keys=True))
          PY

          mkdir "$scratch/metadata"
          ZRPC_BUILDER_METADATA="$scratch/metadata" python3 -I - <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          sys.path.insert(0, str(Path.cwd() / "tools/gcp-guest"))
          import fetch_builder_closure

          report = fetch_builder_closure.fetch_reviewed_metadata(
              Path(os.environ["ZRPC_BUILDER_METADATA"]),
          )
          if (report["status"] !=
                  "builder-snapshot-metadata-hashes-matched-signature-unchecked"
                  or report["signed_snapshot_rechecked"] is not False
                  or report["complete_builder_toolchain"] is not False
                  or report["image_built"] is not False
                  or report["private_mode_approved"] is not False):
              raise ValueError("metadata fetch changed diagnostic acceptance status")
          print(json.dumps(report, sort_keys=True))
          PY

          mkdir "$scratch/guest-archives"
          ZRPC_GUEST_ARCHIVES="$scratch/guest-archives" python3 -I - <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          sys.path.insert(0, str(Path.cwd() / "tools/gcp-guest"))
          import fetch_guest_closure

          report = fetch_guest_closure.prefetch_archives(
              Path(os.environ["ZRPC_GUEST_ARCHIVES"]),
          )
          if (report["status"] !=
                  "diagnostic-guest-archive-hashes-matched-signature-unchecked"
                  or report["package_count"] != 104
                  or report["signed_snapshot_rechecked"] is not False
                  or report["archive_hashes_matched_source_lock"] is not True
                  or report["installed_closure_checked"] is not False
                  or report["package_scripts_executed"] is not False
                  or report["image_built"] is not False
                  or report["private_mode_approved"] is not False):
              raise ValueError("guest archive prefetch changed diagnostic acceptance status")
          print(json.dumps(report, sort_keys=True))
          PY

          # Only the commands below execute staged code. The outer namespace
          # has no network route. Signature and APT-plan checks execute using
          # the hash-checked staged gpgv, Python, apt-get, and shared libraries
          # before the remaining staged tools are exercised. This still does
          # not prove the complete installed builder or a guest image.
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          chroot_command="$(command -v chroot)"
          parent_user_ns="$(readlink /proc/self/ns/user)"
          parent_mount_ns="$(readlink /proc/self/ns/mnt)"
          parent_net_ns="$(readlink /proc/self/ns/net)"
          sudo -n unshare --mount --net --propagation private bash -c '
            set -euo pipefail
            staged=$1
            run_uid=$2
            run_gid=$3
            chroot_command=$7
            source=$8
            archives=$9
            metadata=${10}
            guest_archives=${11}
            test "$(readlink /proc/self/ns/user)" = "$4"
            test "$(readlink /proc/self/ns/mnt)" != "$5"
            test "$(readlink /proc/self/ns/net)" != "$6"
            test "$(ip -o link show | wc -l)" -eq 1
            test -z "$(ip -4 route show)"
            test -z "$(ip -6 route show)"
            echo "Isolated mount namespace: $(readlink /proc/self/ns/mnt)"
            echo "Isolated network namespace: $(readlink /proc/self/ns/net)"

            for directory in zrpc-source zrpc-archives zrpc-metadata zrpc-guest-archives zrpc-apt-scratch proc dev; do
              test ! -L "$staged/$directory"
              mkdir -p "$staged/$directory"
            done
            chown "$run_uid:$run_gid" "$staged/zrpc-apt-scratch"
            mount --bind "$source" "$staged/zrpc-source"
            mount -o remount,bind,ro "$staged/zrpc-source"
            mount --bind "$archives" "$staged/zrpc-archives"
            mount -o remount,bind,ro "$staged/zrpc-archives"
            mount --bind "$metadata" "$staged/zrpc-metadata"
            mount -o remount,bind,ro "$staged/zrpc-metadata"
            mount --bind "$guest_archives" "$staged/zrpc-guest-archives"
            mount -o remount,bind,ro "$staged/zrpc-guest-archives"
            mount -t proc proc "$staged/proc"
            test ! -e "$staged/dev/null"
            touch "$staged/dev/null"
            mount --bind /dev/null "$staged/dev/null"

            run_staged() {
              /usr/bin/env -i PATH=/usr/bin:/bin HOME=/nonexistent \
                LC_ALL=C PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 \
                "$chroot_command" --userspec="$run_uid:$run_gid" "$staged" "$@"
            }
            run_staged /usr/bin/python3 -I - <<"PY"
          import json
          from pathlib import Path
          import sys

          sys.path.insert(0, "/zrpc-source/tools/gcp-guest")
          import verify_builder_closure

          report = verify_builder_closure.verify(
              Path("/zrpc-metadata/InRelease"),
              Path("/zrpc-metadata/Packages.xz"),
              Path("/zrpc-archives"),
              Path("/usr/bin/apt-get"),
              Path("/zrpc-apt-scratch"),
          )
          if (report["status"] != "diagnostic-signed-builder-apt-plan-matched-unbuilt"
                  or report["package_count"] != 199
                  or report["complete_builder_toolchain"] is not False
                  or report["image_built"] is not False
                  or report["private_mode_approved"] is not False):
              raise ValueError("signed snapshot check changed diagnostic acceptance status")
          print(json.dumps(report, sort_keys=True))
          PY
            run_staged /usr/bin/python3 -I - <<"PY"
          import json
          from pathlib import Path
          import sys

          sys.path.insert(0, "/zrpc-source/tools/gcp-guest")
          import fetch_guest_closure

          report = fetch_guest_closure.verify_cached_archives(
              Path("/zrpc-metadata"), Path("/zrpc-guest-archives"),
          )
          if (report["status"] !=
                  "diagnostic-guest-archives-matched-signed-snapshot-unbuilt"
                  or report["package_count"] != 104
                  or report["signed_snapshot_rechecked"] is not True
                  or report["archive_bytes_checked"] is not True
                  or report["installed_closure_checked"] is not False
                  or report["package_scripts_executed"] is not False
                  or report["image_built"] is not False
                  or report["private_mode_approved"] is not False):
              raise ValueError("guest archive diagnostic changed acceptance status")
          print(json.dumps(report, sort_keys=True))
          PY
            test "$(run_staged /usr/bin/python3 -I -c "import os; print(os.geteuid())")" = "$run_uid"
            echo "Staged command UID: $run_uid"
            run_staged /lib64/ld-linux-x86-64.so.2 --list /usr/bin/systemd-repart
            run_staged /usr/bin/mkosi --version
            run_staged /usr/bin/systemd-repart --version
            run_staged /usr/bin/ukify --version
            run_staged /usr/bin/reprepro --version
            echo "Diagnostic staged tool startup passed; no image built or approved."
          ' _ "$scratch/staged" "$runner_uid" "$runner_gid" \
            "$parent_user_ns" "$parent_mount_ns" "$parent_net_ns" "$chroot_command" \
            "$source" "$scratch/archives" "$scratch/metadata" \
            "$scratch/guest-archives"

      - name: Diagnostic packaged mkosi sandbox in root-owned namespaces
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test "$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD)" = "$GITHUB_SHA"

          # The preceding step rechecked the Debian signature, exact builder
          # APT plan, and guest archive bytes before executing staged tools.
          # This is a separate capability diagnostic, not an image build.
          staged="$GITHUB_WORKSPACE/builder-closure/staged"
          python3 - "$staged/.zrpc-builder-toolchain.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          report = json.loads(Path(sys.argv[1]).read_bytes())
          if (report["status"] != "diagnostic-builder-payloads-staged-unbuilt"
                  or report["package_count"] != 199
                  or report["package_scripts_executed"] is not False
                  or report["complete_builder_toolchain"] is not False
                  or report["image_built"] is not False
                  or report["private_mode_approved"] is not False):
              raise SystemExit("signed builder staging did not retain diagnostic status")
          PY
          test -x "$staged/usr/bin/mkosi-sandbox"
          test -x "$staged/usr/bin/reprepro"
          test -f "$staged/usr/lib/python3/dist-packages/mkosi/sandbox.py"
          test -x "$staged/usr/bin/true"

          # The UID 0:0 map cannot traverse the runner-owned home/workspace.
          # Copy only the already-staged public Debian tree to root-owned
          # scratch. No signing key, cloud credential, source write, or upload
          # enters this diagnostic. chroot is not a security boundary.
          root_scratch="$(sudo -n mktemp -d /var/tmp/zrpc-packaged-mkosi.XXXXXX)"
          host_canary="$(mktemp /var/tmp/zrpc-host-only.XXXXXX)"
          trap 'sudo -n rm -rf -- "$root_scratch"; rm -f -- "$host_canary"' EXIT
          sudo -n cp -a --no-preserve=ownership -- "$staged"/. "$root_scratch"/
          sudo -n test ! -L "$root_scratch/tmp"
          sudo -n install -d -m 1777 "$root_scratch/tmp"
          test "$(sudo -n stat -c %u "$root_scratch/usr/bin/mkosi-sandbox")" = 0
          sudo -n cmp -s -- "$staged/.zrpc-builder-toolchain.json" \
            "$root_scratch/.zrpc-builder-toolchain.json"
          sudo -n cmp -s -- "$staged/usr/bin/mkosi-sandbox" "$root_scratch/usr/bin/mkosi-sandbox"
          sudo -n cmp -s -- "$staged/usr/bin/reprepro" "$root_scratch/usr/bin/reprepro"
          sudo -n cmp -s -- "$staged/usr/lib/python3/dist-packages/mkosi/sandbox.py" \
            "$root_scratch/usr/lib/python3/dist-packages/mkosi/sandbox.py"
          sudo -n cmp -s -- "$staged/usr/bin/true" "$root_scratch/usr/bin/true"

          parent_user_ns="$(readlink /proc/self/ns/user)"
          parent_mount_ns="$(readlink /proc/self/ns/mnt)"
          parent_net_ns="$(readlink /proc/self/ns/net)"
          parent_pid_ns="$(readlink /proc/self/ns/pid)"
          chroot_command="$(command -v chroot)"
          sudo -n unshare --user --map-root-user --mount --net --pid --fork \
            --mount-proc --propagation private bash -c '
            set -euo pipefail
            root=$1
            test "$(readlink /proc/self/ns/user)" != "$2"
            test "$(readlink /proc/self/ns/mnt)" != "$3"
            test "$(readlink /proc/self/ns/net)" != "$4"
            test "$(readlink /proc/self/ns/pid)" != "$5"
            test "$(id -u):$(id -g)" = 0:0
            read -r inner outer count < /proc/self/uid_map
            test "$inner:$outer:$count" = 0:0:1
            read -r inner outer count < /proc/self/gid_map
            test "$inner:$outer:$count" = 0:0:1
            test "$(ip -o link show | wc -l)" -eq 1
            test -z "$(ip -4 route show)"
            test -z "$(ip -6 route show)"
            test -f "$7"
            test ! -e "$root$7"
            # mkosi changes / mount propagation before creating its sandbox.
            # A plain chroot directory is not a mount point for that operation.
            mount --bind "$root" "$root"
            mountpoint -q "$root"
            test -d "$root/proc" && test ! -L "$root/proc"
            mount -t proc proc "$root/proc"
            /usr/bin/env -i PATH=/usr/bin:/bin HOME=/nonexistent \
              LC_ALL=C PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 \
              "$6" "$root" /usr/bin/mkosi-sandbox \
                --ro-bind / / --unshare-net -- /usr/bin/true
            # Apt.sandbox(network=True) sets SYSTEMD_OFFLINE=0 and does not
            # request an inner network namespace. Test those exact network
            # options with its become-root/suppress-chown flags and a harmless
            # command. This does not run APT or any package hook.
            outer_user="$(readlink /proc/self/ns/user)"
            outer_mount="$(readlink /proc/self/ns/mnt)"
            outer_net="$(readlink /proc/self/ns/net)"
            outer_pid="$(readlink /proc/self/ns/pid)"
            /usr/bin/env -i PATH=/usr/bin:/bin HOME=/nonexistent \
              LC_ALL=C PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 \
              "$6" "$root" /usr/bin/mkosi-sandbox \
                --proc /proc --ro-bind / / \
                --setenv SYSTEMD_OFFLINE 0 \
                --unshare-ipc --become-root --suppress-chown -- \
                /usr/bin/python3 -I - "$outer_user" "$outer_mount" \
                  "$outer_net" "$outer_pid" "$7" <<"PY"
          import errno
          import json
          import os
          from pathlib import Path
          import sys

          outer = dict(zip(("user", "mnt", "net", "pid"), sys.argv[1:5]))
          inner = {name: os.readlink("/proc/self/ns/" + name) for name in outer}
          if (inner["user"] == outer["user"] or inner["mnt"] == outer["mnt"]
                  or inner["net"] != outer["net"] or inner["pid"] != outer["pid"]):
              raise ValueError(
                  "mkosi APT-equivalent namespace boundary changed: "
                  + json.dumps({"outer": outer, "inner": inner}, sort_keys=True)
              )
          if os.getenv("SYSTEMD_OFFLINE") != "0":
              raise ValueError("mkosi network=True option was not retained")
          if len(Path("/proc/net/route").read_text().splitlines()) != 1:
              raise ValueError("IPv4 route appeared inside mkosi sandbox")
          ipv6 = Path("/proc/net/ipv6_route")
          if ipv6.exists() and ipv6.read_text().strip():
              raise ValueError("IPv6 route appeared inside mkosi sandbox")
          if Path(sys.argv[5]).exists():
              raise ValueError("host-only canary entered mkosi sandbox")
          try:
              descriptor = os.open("/.zrpc-builder-toolchain.json", os.O_WRONLY)
          except OSError as error:
              if error.errno not in (errno.EROFS, errno.EACCES, errno.EPERM):
                  raise
          else:
              os.close(descriptor)
              raise ValueError("reviewed builder manifest was writable")
          print(json.dumps({
              "status": "diagnostic-mkosi-network-true-canary-passed-unbuilt",
              "outer_network_namespace_retained": True,
              "ipv4_routes": 0, "ipv6_routes": 0,
              "host_canary_visible": False, "reviewed_manifest_writable": False,
              "package_scripts_executed": False, "image_built": False,
              "private_mode_approved": False,
          }, sort_keys=True))
          PY
          ' _ "$root_scratch" "$parent_user_ns" "$parent_mount_ns" \
            "$parent_net_ns" "$parent_pid_ns" "$chroot_command" "$host_canary"

          printf '%s\n' '{"status":"diagnostic-packaged-mkosi-sandbox-passed-unbuilt","package_scripts_executed":false,"image_built":false,"approved_release":false,"private_mode_approved":false}'
