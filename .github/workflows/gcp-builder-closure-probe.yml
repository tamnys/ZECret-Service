name: GCP pinned builder payload staging probe

on:
  workflow_dispatch:

permissions: {}

jobs:
  stage:
    name: Diagnostic locked payload staging and chroot tool startup
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch exact source commit and locked Debian payloads
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64

          source="$GITHUB_WORKSPACE/source"
          scratch="$GITHUB_WORKSPACE/builder-closure"
          mkdir "$source" "$scratch" "$scratch/archives"
          git -C "$source" init -q
          git -C "$source" fetch -q --no-tags --depth=1 \
            "https://github.com/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          test "$(git -C "$source" rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git -C "$source" checkout -q --detach FETCH_HEAD
          cd "$source"

          ZRPC_BUILDER_ARCHIVES="$scratch/archives" python3 -I - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys

          root = Path.cwd()
          sys.path.insert(0, str(root / "tools/gcp-guest"))
          import debian_snapshot
          import fetch_builder_closure
          import verify_builder_closure
          import verify_builder_packages

          lock_path = verify_builder_closure.LOCK
          lock_bytes = debian_snapshot.bounded_regular_bytes(
              lock_path, verify_builder_closure.LOCK_BYTES, "builder closure lock"
          )
          if (len(lock_bytes) != verify_builder_closure.LOCK_BYTES or
                  hashlib.sha256(lock_bytes).hexdigest() != verify_builder_closure.LOCK_SHA256):
              raise ValueError("builder closure differs from source-reviewed candidate")
          lock = json.loads(lock_bytes, object_pairs_hook=verify_builder_packages.unique_object)
          if (lock.get("schema_version") != 1 or
                  lock.get("status") != "apt-resolved-candidate-unbuilt-unapproved" or
                  lock.get("snapshot") !=
                  "https://snapshot.debian.org/archive/debian/20260918T000000Z/" or
                  not isinstance(lock.get("packages"), list) or not lock["packages"]):
              raise ValueError("unsupported builder closure")
          names = [entry.get("name") for entry in lock["packages"]]
          if names != sorted(set(names)):
              raise ValueError("builder closure package order differs from review")

          archives = Path(os.environ["ZRPC_BUILDER_ARCHIVES"])
          directory = os.open(
              archives, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW | os.O_CLOEXEC
          )
          try:
              for entry in lock["packages"]:
                  fetch_builder_closure.download_one(
                      directory, entry, lock["snapshot"]
                  )
                  if not fetch_builder_closure.verify_cached(directory, entry):
                      raise ValueError("locked builder archive missing after download")
          finally:
              os.close(directory)
          print(json.dumps({
              "status": "diagnostic-locked-builder-archives-fetched-unbuilt",
              "closure_lock_sha256": hashlib.sha256(lock_bytes).hexdigest(),
              "package_count": len(lock["packages"]),
              "signed_snapshot_rechecked": False,
              "package_scripts_executed": False,
              "runtime_execution_verified": False,
              "complete_builder_toolchain": False,
              "image_built": False,
              "private_mode_approved": False,
          }, sort_keys=True))
          PY

          CODEX_WORKSPACE_DIR="$GITHUB_WORKSPACE" \
            python3 tools/gcp-guest/stage_builder_toolchain.py \
              --archives "$scratch/archives" --output "$scratch/staged"
          python3 - "$scratch/staged/.zrpc-builder-toolchain.json" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          data = path.read_bytes()
          report = json.loads(data)
          if (report["status"] != "diagnostic-builder-payloads-staged-unbuilt" or
                  report["package_count"] != 199 or
                  report["signed_snapshot_rechecked"] is not False or
                  report["package_scripts_executed"] is not False or
                  report["runtime_execution_verified"] is not False or
                  report["complete_builder_toolchain"] is not False or
                  report["image_built"] is not False or
                  report["private_mode_approved"] is not False):
              raise ValueError("staging diagnostic changed acceptance status")
          print(json.dumps({
              "status": report["status"],
              "manifest_sha256": hashlib.sha256(data).hexdigest(),
              "package_count": report["package_count"],
              "entry_count": len(report["entries"]),
              "runtime_execution_verified": False,
              "image_built": False,
              "private_mode_approved": False,
          }, sort_keys=True))
          PY

          mkdir "$scratch/metadata"
          ZRPC_BUILDER_METADATA="$scratch/metadata" python3 -I - <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          sys.path.insert(0, str(Path.cwd() / "tools/gcp-guest"))
          import fetch_builder_closure

          report = fetch_builder_closure.fetch_reviewed_metadata(
              Path(os.environ["ZRPC_BUILDER_METADATA"]),
          )
          if (report["status"] !=
                  "builder-snapshot-metadata-hashes-matched-signature-unchecked"
                  or report["signed_snapshot_rechecked"] is not False
                  or report["complete_builder_toolchain"] is not False
                  or report["image_built"] is not False
                  or report["private_mode_approved"] is not False):
              raise ValueError("metadata fetch changed diagnostic acceptance status")
          print(json.dumps(report, sort_keys=True))
          PY

          mkdir "$scratch/guest-archives"
          ZRPC_GUEST_ARCHIVES="$scratch/guest-archives" python3 -I - <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          sys.path.insert(0, str(Path.cwd() / "tools/gcp-guest"))
          import fetch_guest_closure

          report = fetch_guest_closure.prefetch_archives(
              Path(os.environ["ZRPC_GUEST_ARCHIVES"]),
          )
          if (report["status"] !=
                  "diagnostic-guest-archive-hashes-matched-signature-unchecked"
                  or report["package_count"] != 104
                  or report["signed_snapshot_rechecked"] is not False
                  or report["archive_hashes_matched_source_lock"] is not True
                  or report["installed_closure_checked"] is not False
                  or report["package_scripts_executed"] is not False
                  or report["image_built"] is not False
                  or report["private_mode_approved"] is not False):
              raise ValueError("guest archive prefetch changed diagnostic acceptance status")
          print(json.dumps(report, sort_keys=True))
          PY

          echo "Runner free space after locked archive fetch (bytes):"
          df -B1 "$GITHUB_WORKSPACE"
          echo "Runner scratch use before guest payload staging (bytes):"
          du -B1 -s "$scratch"

          report_disk_evidence() {
            echo "Runner free space after guest payload attempt (bytes):"
            df -B1 "$GITHUB_WORKSPACE"
            echo "Runner scratch and component use after guest payload attempt (bytes):"
            for path in "$scratch" "$scratch/archives" "$scratch/guest-archives" \
              "$scratch/staged/zrpc-guest-payload-parent/tree"; do
              if test -d "$path"; then
                sudo -n du -B1 -s "$path"
              else
                echo "absent: $path"
              fi
            done
          }
          trap report_disk_evidence EXIT

          # Only the commands below execute staged code. The outer namespace
          # has no network route. Signature and APT-plan checks execute using
          # the hash-checked staged gpgv, Python, apt-get, and shared libraries
          # before the remaining staged tools are exercised. This still does
          # not prove the complete installed builder or a guest image.
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          chroot_command="$(command -v chroot)"
          parent_user_ns="$(readlink /proc/self/ns/user)"
          parent_mount_ns="$(readlink /proc/self/ns/mnt)"
          parent_net_ns="$(readlink /proc/self/ns/net)"
          sudo -n unshare --mount --net --propagation private bash -c '
            set -euo pipefail
            staged=$1
            run_uid=$2
            run_gid=$3
            chroot_command=$7
            source=$8
            archives=$9
            metadata=${10}
            guest_archives=${11}
            test "$(readlink /proc/self/ns/user)" = "$4"
            test "$(readlink /proc/self/ns/mnt)" != "$5"
            test "$(readlink /proc/self/ns/net)" != "$6"
            test "$(ip -o link show | wc -l)" -eq 1
            test -z "$(ip -4 route show)"
            test -z "$(ip -6 route show)"
            echo "Isolated mount namespace: $(readlink /proc/self/ns/mnt)"
            echo "Isolated network namespace: $(readlink /proc/self/ns/net)"

            # mkosi-sandbox changes propagation on its chroot /, which must
            # itself be a mount point (as in the separate sandbox probe below).
            test ! -L "$staged"
            mount --bind "$staged" "$staged"
            mountpoint -q "$staged"

            for directory in zrpc-source zrpc-archives zrpc-metadata zrpc-guest-archives zrpc-apt-scratch zrpc-guest-payload-parent proc dev; do
              test ! -L "$staged/$directory"
              mkdir -p "$staged/$directory"
            done
            chown "$run_uid:$run_gid" "$staged/zrpc-apt-scratch"
            chown "$run_uid:$run_gid" "$staged/zrpc-guest-payload-parent"
            mount --bind "$source" "$staged/zrpc-source"
            mount -o remount,bind,ro "$staged/zrpc-source"
            mount --bind "$archives" "$staged/zrpc-archives"
            mount -o remount,bind,ro "$staged/zrpc-archives"
            mount --bind "$metadata" "$staged/zrpc-metadata"
            mount -o remount,bind,ro "$staged/zrpc-metadata"
            mount --bind "$guest_archives" "$staged/zrpc-guest-archives"
            mount -o remount,bind,ro "$staged/zrpc-guest-archives"
            mount -t proc proc "$staged/proc"
            # Pinned mkosi-sandbox DevOperation requires these API devices in
            # its old root. Do not expose the optional /dev/fuse device.
            for device in null zero full random urandom tty; do
              test -c "/dev/$device"
              test ! -e "$staged/dev/$device"
              test ! -L "$staged/dev/$device"
              touch "$staged/dev/$device"
              mount --bind "/dev/$device" "$staged/dev/$device"
              test -c "$staged/dev/$device"
            done

            run_staged() {
              /usr/bin/env -i PATH=/usr/bin:/bin HOME=/nonexistent \
                LC_ALL=C PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 \
                "$chroot_command" --userspec="$run_uid:$run_gid" "$staged" "$@"
            }
            run_staged /usr/bin/python3 -I - <<"PY"
          import json
          from pathlib import Path
          import sys

          sys.path.insert(0, "/zrpc-source/tools/gcp-guest")
          import verify_builder_closure

          report = verify_builder_closure.verify(
              Path("/zrpc-metadata/InRelease"),
              Path("/zrpc-metadata/Packages.xz"),
              Path("/zrpc-archives"),
              Path("/usr/bin/apt-get"),
              Path("/zrpc-apt-scratch"),
          )
          if (report["status"] != "diagnostic-signed-builder-apt-plan-matched-unbuilt"
                  or report["package_count"] != 199
                  or report["complete_builder_toolchain"] is not False
                  or report["image_built"] is not False
                  or report["private_mode_approved"] is not False):
              raise ValueError("signed snapshot check changed diagnostic acceptance status")
          print(json.dumps(report, sort_keys=True))
          PY
            # The builder closure above is extracted as inert payloads, not
            # installed by dpkg. This inventories the guest packages that a
            # later mkosi build would install, without executing any control
            # archive member or accepting a private-mode release.
            run_staged /usr/bin/python3 -I - <<"PY"
          import json
          from pathlib import Path
          import sys

          sys.path.insert(0, "/zrpc-source/tools/gcp-guest")
          import inventory_guest_scripts

          report = inventory_guest_scripts.inventory(
              Path("/zrpc-metadata"), Path("/zrpc-guest-archives"),
          )
          if (report["status"] != inventory_guest_scripts.STATUS
                  or report["package_count"] != 104
                  or report["control_file_count"] != 477
                  or report["maintainer_script_count"] != 95
                  or report["trigger_file_count"] != 57
                  or report["signed_snapshot_rechecked"] is not True
                  or report["archive_bytes_checked"] is not True
                  or report["package_scripts_executed"] is not False
                  or report["image_built"] is not False
                  or report["private_mode_approved"] is not False):
              raise ValueError("guest control inventory changed diagnostic acceptance status")
          print(json.dumps({key: value for key, value in report.items()
                            if key != "packages"}, sort_keys=True))
          for package in report["packages"]:
              print(json.dumps({"guest_control_package": package}, sort_keys=True))
          PY
            run_staged /usr/bin/python3 -I - <<"PY"
          import json
          from pathlib import Path
          import sys

          sys.path.insert(0, "/zrpc-source/tools/gcp-guest")
          import fetch_guest_closure

          report = fetch_guest_closure.verify_cached_archives(
              Path("/zrpc-metadata"), Path("/zrpc-guest-archives"),
          )
          if (report["status"] !=
                  "diagnostic-guest-archives-matched-signed-snapshot-unbuilt"
                  or report["package_count"] != 104
                  or report["signed_snapshot_rechecked"] is not True
                  or report["archive_bytes_checked"] is not True
                  or report["installed_closure_checked"] is not False
                  or report["package_scripts_executed"] is not False
                  or report["image_built"] is not False
                  or report["private_mode_approved"] is not False):
              raise ValueError("guest archive diagnostic changed acceptance status")
          print(json.dumps(report, sort_keys=True))
          PY
            run_staged /usr/bin/python3 -I - <<"PY"
          import json
          from pathlib import Path
          import sys

          sys.path.insert(0, "/zrpc-source/tools/gcp-guest")
          import stage_guest_payload

          audit = stage_guest_payload.audit_unsupported_members(
              Path("/zrpc-metadata"), Path("/zrpc-guest-archives"),
          )
          summary = {key: value for key, value in audit.items()
                     if key != "unsupported_members"}
          print(json.dumps(summary, sort_keys=True))
          for member in audit["unsupported_members"]:
              print(json.dumps({"unsupported_member": member}, sort_keys=True))
          if (audit["package_count"] != 104
                  or audit["signed_snapshot_rechecked"] is not True
                  or audit["archive_bytes_checked"] is not True
                  or audit["payload_tree_staged"] is not False
                  or audit["installed_closure_checked"] is not False
                  or audit["package_scripts_executed"] is not False
                  or audit["image_built"] is not False
                  or audit["private_mode_approved"] is not False):
              raise ValueError("unsupported-member audit changed acceptance status")
          if audit["unsupported_count"]:
              raise ValueError("signed guest payload contains unsupported members")

          report = stage_guest_payload.stage(
              Path("/zrpc-metadata"), Path("/zrpc-guest-archives"),
              Path("/zrpc-guest-payload-parent/tree"),
              Path("/zrpc-guest-payload-parent"),
          )
          if (report["status"] !=
                  "diagnostic-signed-guest-payloads-staged-data-only"
                  or report["package_count"] != 104
                  or report["signed_snapshot_rechecked"] is not True
                  or report["archive_bytes_checked"] is not True
                  or report["payload_tree_staged"] is not True
                  or report["installed_closure_checked"] is not False
                  or report["package_scripts_executed"] is not False
                  or report["runtime_execution_verified"] is not False
                  or report["image_built"] is not False
                  or report["private_mode_approved"] is not False):
              raise ValueError("guest payload staging changed acceptance status")
          print(json.dumps(report, sort_keys=True))
          PY
            # Inventory original package ownership/modes and the actual inert
            # staged tree. The full report stays on the runner workspace; only
            # its digest and unresolved gaps enter the public job log.
            run_staged /usr/bin/python3 -I - <<"PY"
          import json
          from pathlib import Path
          import sys

          sys.path.insert(0, "/zrpc-source/tools/gcp-guest")
          import preflight_guest_base_tree

          report_path = Path("/zrpc-guest-payload-parent/boot-root-preflight.json")
          sys.argv = ["preflight_guest_base_tree", "--metadata", "/zrpc-metadata",
                      "--archives", "/zrpc-guest-archives", "--staged-root",
                      "/zrpc-guest-payload-parent/tree", "--output", str(report_path)]
          if preflight_guest_base_tree.main():
              raise ValueError("guest BaseTrees diagnostic failed")
          report = json.loads(report_path.read_bytes())
          if (report["status"] != preflight_guest_base_tree.STATUS
                  or len(report["packages"]) != 104
                  or not report["root_archive_entries"]
                  or not report["initrd_seed_archive_entries"]
                  or not report["staged_root_entries"]
                  or not report["gaps"]
                  or report["signed_snapshot_rechecked"] is not True
                  or report["archive_bytes_checked"] is not True
                  or report["staged_payload_content_rechecked"] is not False
                  or report["initrd_seed_tree_staged"] is not False
                  or report["package_scripts_executed"] is not False
                  or report["image_built"] is not False
                  or report["boot_verified"] is not False
                  or report["private_mode_approved"] is not False):
              raise ValueError("BaseTrees diagnostic changed acceptance status")
          PY
            # Assemble a separate, rootless tar from the authenticated .deb
            # data members. It retains numeric owners and link semantics,
            # recording only the regular-file SUID/SGID removal required by
            # audit-rootfs.py. This is still not an installed or bootable root.
            run_staged /usr/bin/python3 -I - <<"PY"
          import json
          from pathlib import Path
          import sys

          sys.path.insert(0, "/zrpc-source/tools/gcp-guest")
          import assemble_guest_base_tree as candidate

          artifact = Path("/zrpc-guest-payload-parent/root-basetree")
          report = candidate.assemble(
              Path("/zrpc-metadata"), Path("/zrpc-guest-archives"),
              artifact, Path("/zrpc-guest-payload-parent"),
          )
          verified = candidate.verify(
              Path("/zrpc-metadata"), Path("/zrpc-guest-archives"), artifact,
          )
          if (report["status"] != candidate.STATUS
                  or report["package_count"] != 104
                  or report["archive_sha256"] != verified["archive_sha256"]
                  or report["manifest_sha256"] != verified["manifest_sha256"]
                  or report["signed_snapshot_rechecked"] is not True
                  or report["archive_bytes_checked"] is not True
                  or report["package_scripts_executed"] is not False
                  or report["image_built"] is not False
                  or report["boot_verified"] is not False
                  or report["private_mode_approved"] is not False):
              raise ValueError("root BaseTrees candidate changed diagnostic status")
          print(json.dumps(report, sort_keys=True))
          PY
            # GNU tar numeric-owner extraction is exercised with effective
            # root in this already no-route mount/network namespace. The
            # extracted tree is data only; no file from it is executed.
            extracted="$staged/zrpc-guest-payload-parent/extracted-root"
            mkdir "$extracted"
            tar --numeric-owner --same-permissions --no-overwrite-dir \
              -xf "$staged/zrpc-guest-payload-parent/root-basetree/guest-root.tar" \
              -C "$extracted"
            /usr/bin/env -i PATH=/usr/bin:/bin HOME=/nonexistent \
              LC_ALL=C PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 \
              "$chroot_command" "$staged" /usr/bin/python3 -I - <<"PY"
          import json
          from pathlib import Path
          import sys

          sys.path.insert(0, "/zrpc-source/tools/gcp-guest")
          import assemble_guest_base_tree as candidate

          report = candidate.verify_extracted(
              Path("/zrpc-metadata"), Path("/zrpc-guest-archives"),
              Path("/zrpc-guest-payload-parent/root-basetree"),
              Path("/zrpc-guest-payload-parent/extracted-root"),
          )
          if (report["status"] != candidate.STATUS
                  or report["extracted_numeric_owners_checked"] is not True
                  or report["extracted_contents_checked"] is not True
                  or report["package_scripts_executed"] is not False
                  or report["image_built"] is not False
                  or report["boot_verified"] is not False
                  or report["private_mode_approved"] is not False):
              raise ValueError("root BaseTrees extraction changed diagnostic status")
          print(json.dumps(report, sort_keys=True))
          PY
            # This separate diagnostic profile snapshots the signed-source
            # BaseTrees tar and configures custom mkosi with no packages. It
            # cannot emit a UKI, disk, initrd, or private-mode approval.
            run_staged /usr/bin/python3 -I - <<"PY"
          import json
          from pathlib import Path
          import sys

          sys.path.insert(0, "/zrpc-source/tools/gcp-guest")
          import build_guest_accounts as accounts
          import prepare_guest_basetree_profile as diagnostic

          metadata = Path("/zrpc-metadata")
          archives = Path("/zrpc-guest-archives")
          artifact = Path("/zrpc-guest-payload-parent/root-basetree")
          profile = Path("/zrpc-guest-payload-parent/mkosi-root-profile")
          workspace = Path("/zrpc-guest-payload-parent")
          expected = workspace / "expected-accounts"
          generated = accounts.build(metadata, archives, workspace, expected)
          if (generated["status"] != "diagnostic-reproducible-guest-accounts-unbuilt"
                  or generated["independent_generation_runs_matched"] is not True
                  or generated["installed_rootfs_accounts_compared"] is not False
                  or generated["image_built"] is not False
                  or generated["private_mode_approved"] is not False):
              raise ValueError("signed-source account generation changed diagnostic status")
          prepared = diagnostic.prepare_profile(
              metadata, archives, artifact, expected, profile, workspace,
          )
          checked = diagnostic.verify_profile(
              metadata, archives, artifact, expected, profile, workspace,
          )
          if (prepared != checked or prepared["status"] != diagnostic.STATUS
                  or prepared["account_files_preseeded_from_signed_source"] is not True
                  or prepared["package_install_configured"] is not False
                  or prepared["package_scripts_executed"] is not False
                  or prepared["root_directory_built"] is not False
                  or prepared["disk_image_built"] is not False
                  or prepared["boot_verified"] is not False
                  or prepared["private_mode_approved"] is not False):
              raise ValueError("mkosi BaseTrees profile changed diagnostic status")
          print(json.dumps(prepared, sort_keys=True))
          PY
            profile_root="$staged/zrpc-guest-payload-parent/mkosi-root-profile"
            echo "Diagnostic profile bind mount starting"
            mount --bind "$profile_root" "$profile_root"
            echo "Diagnostic profile bind mount succeeded"
            mount -o remount,bind,ro "$profile_root"
            echo "Diagnostic profile read-only remount succeeded"
            profile_options="$(findmnt -n -o OPTIONS --target "$profile_root")"
            printf "Diagnostic profile observed mount options: %s\n" "$profile_options"
            case ",$profile_options," in *,ro,*) ;; *) exit 1 ;; esac
            echo "Diagnostic profile read-only assertion succeeded"
            run_staged_root() {
              /usr/bin/env -i PATH=/usr/bin:/bin HOME=/nonexistent \
                LC_ALL=C PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 \
                "$chroot_command" "$staged" "$@"
            }
            # Pinned mkosi still runs its sysusers/tmpfiles/preset/depmod/
            # firstboot/hwdb and output stages. The checks below report
            # produced-root differences without approving any generated effect.
            run_staged_root /usr/bin/python3 -I - <<"PY"
          import json
          import hashlib
          from pathlib import Path
          import sys

          sys.path.insert(0, "/zrpc-source/tools/gcp-guest")
          import audit_mkosi_root_accounts as account_audit
          import audit_mkosi_root_tree as tree_audit
          import build_guest_accounts as accounts
          import prepare_guest_basetree_profile as diagnostic

          workspace = Path("/zrpc-guest-payload-parent")
          expected = workspace / "expected-accounts"
          result = diagnostic.build_root_directory(
              Path("/zrpc-metadata"), Path("/zrpc-guest-archives"),
              Path("/zrpc-guest-payload-parent/root-basetree"),
              expected,
              Path("/zrpc-guest-payload-parent/mkosi-root-profile"),
              workspace,
          )
          if (result["status"] != "diagnostic-root-directory-built-unapproved"
                  or result["account_files_preseeded_from_signed_source"] is not True
                  or result["package_install_configured"] is not False
                  or result["package_scripts_executed"] is not False
                  or result["root_directory_built"] is not True
                  or result["post_mkosi_tree_audited"] is not False
                  or result["disk_image_built"] is not False
                  or result["boot_verified"] is not False
                  or result["private_mode_approved"] is not False):
              raise ValueError("mkosi root directory changed diagnostic status")
          print(json.dumps(result, sort_keys=True))

          compared = account_audit.audit(
              Path("/zrpc-metadata"), Path("/zrpc-guest-archives"),
              Path("/zrpc-guest-payload-parent/root-basetree"),
              Path("/zrpc-guest-payload-parent/mkosi-root-profile"),
              workspace, expected,
          )
          if (compared["status"] != account_audit.STATUS
                  or compared["account_artifact_regenerated_and_verified"] is not True
                  or compared["account_files_preseeded_from_signed_source"] is not True
                  or compared["produced_root_account_bytes_modes_owners_compared"] is not True
                  or compared["package_install_configured"] is not False
                  or compared["package_scripts_executed"] is not False
                  or compared["post_mkosi_tree_audited"] is not False
                  or compared["disk_image_built"] is not False
                  or compared["boot_verified"] is not False
                  or compared["private_mode_approved"] is not False):
              raise ValueError("produced root account audit changed diagnostic status")
          print(json.dumps(compared, sort_keys=True))

          tree = tree_audit.audit(
              Path("/zrpc-metadata"), Path("/zrpc-guest-archives"),
              Path("/zrpc-guest-payload-parent/root-basetree"), expected,
              Path("/zrpc-guest-payload-parent/mkosi-root-profile"), workspace,
          )
          deltas = tree["differences"]
          if (tree["status"] not in {tree_audit.STATUS, tree_audit.DELTA_STATUS}
                  or (tree["status"] == tree_audit.DELTA_STATUS) != bool(deltas)
                  or tree["authenticated_inputs_exact"] is not (not deltas)
                  or tree["generated_effects_approved"] is not False
                  or tree["mkosi_execution_verified"] is not False
                  or tree["post_mkosi_tree_audited"] is not False
                  or tree["disk_image_built"] is not False
                  or tree["boot_verified"] is not False
                  or tree["private_mode_approved"] is not False):
              raise ValueError("produced root delta report changed diagnostic status")
          delta_bytes = (json.dumps(deltas, sort_keys=True,
                                    separators=(",", ":")) + "\n").encode()
          summary = {key: value for key, value in tree.items()
                     if key != "differences"}
          summary["difference_count"] = len(deltas)
          summary["difference_sha256"] = hashlib.sha256(delta_bytes).hexdigest()
          print(json.dumps(summary, sort_keys=True))
          for difference in deltas:
              print(json.dumps({"unreviewed_root_delta": difference}, sort_keys=True))
          print("::warning::Mkosi root comparison is diagnostic only; no generated "
                "effects, boot artifact, or private mode are approved")
          PY
            test "$(run_staged /usr/bin/python3 -I -c "import os; print(os.geteuid())")" = "$run_uid"
            echo "Staged command UID: $run_uid"
            run_staged /lib64/ld-linux-x86-64.so.2 --list /usr/bin/systemd-repart
            run_staged /usr/bin/mkosi --version
            run_staged /usr/bin/systemd-repart --version
            run_staged /usr/bin/ukify --version
            run_staged /usr/bin/reprepro --version
            echo "Diagnostic staged tool startup passed; no image built or approved."
          ' _ "$scratch/staged" "$runner_uid" "$runner_gid" \
            "$parent_user_ns" "$parent_mount_ns" "$parent_net_ns" "$chroot_command" \
            "$source" "$scratch/archives" "$scratch/metadata" \
            "$scratch/guest-archives"
      - name: Diagnostic packaged mkosi sandbox in root-owned namespaces
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test "$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD)" = "$GITHUB_SHA"

          # The preceding step rechecked the Debian signature, exact builder
          # APT plan, and guest archive bytes before executing staged tools.
          # This is a separate capability diagnostic, not an image build.
          staged="$GITHUB_WORKSPACE/builder-closure/staged"
          python3 - "$staged/.zrpc-builder-toolchain.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          report = json.loads(Path(sys.argv[1]).read_bytes())
          if (report["status"] != "diagnostic-builder-payloads-staged-unbuilt"
                  or report["package_count"] != 199
                  or report["package_scripts_executed"] is not False
                  or report["complete_builder_toolchain"] is not False
                  or report["image_built"] is not False
                  or report["private_mode_approved"] is not False):
              raise SystemExit("signed builder staging did not retain diagnostic status")
          PY
          test -x "$staged/usr/bin/mkosi-sandbox"
          test -x "$staged/usr/bin/reprepro"
          test -f "$staged/usr/lib/python3/dist-packages/mkosi/sandbox.py"
          test -x "$staged/usr/bin/true"

          # The UID 0:0 map cannot traverse the runner-owned home/workspace.
          # Copy only the already-staged public Debian tree to root-owned
          # scratch. No signing key, cloud credential, source write, or upload
          # enters this diagnostic. chroot is not a security boundary.
          root_scratch="$(sudo -n mktemp -d /var/tmp/zrpc-packaged-mkosi.XXXXXX)"
          trap 'sudo -n rm -rf -- "$root_scratch"' EXIT
          sudo -n cp -a --no-preserve=ownership -- "$staged"/. "$root_scratch"/
          sudo -n test ! -L "$root_scratch/tmp"
          sudo -n install -d -m 1777 "$root_scratch/tmp"
          test "$(sudo -n stat -c %u "$root_scratch/usr/bin/mkosi-sandbox")" = 0
          sudo -n cmp -s -- "$staged/.zrpc-builder-toolchain.json" \
            "$root_scratch/.zrpc-builder-toolchain.json"
          sudo -n cmp -s -- "$staged/usr/bin/mkosi-sandbox" "$root_scratch/usr/bin/mkosi-sandbox"
          sudo -n cmp -s -- "$staged/usr/bin/reprepro" "$root_scratch/usr/bin/reprepro"
          sudo -n cmp -s -- "$staged/usr/lib/python3/dist-packages/mkosi/sandbox.py" \
            "$root_scratch/usr/lib/python3/dist-packages/mkosi/sandbox.py"
          sudo -n cmp -s -- "$staged/usr/bin/true" "$root_scratch/usr/bin/true"

          parent_user_ns="$(readlink /proc/self/ns/user)"
          parent_mount_ns="$(readlink /proc/self/ns/mnt)"
          parent_net_ns="$(readlink /proc/self/ns/net)"
          parent_pid_ns="$(readlink /proc/self/ns/pid)"
          chroot_command="$(command -v chroot)"
          sudo -n unshare --user --map-root-user --mount --net --pid --fork \
            --mount-proc --propagation private bash -c '
            set -euo pipefail
            root=$1
            test "$(readlink /proc/self/ns/user)" != "$2"
            test "$(readlink /proc/self/ns/mnt)" != "$3"
            test "$(readlink /proc/self/ns/net)" != "$4"
            test "$(readlink /proc/self/ns/pid)" != "$5"
            test "$(id -u):$(id -g)" = 0:0
            read -r inner outer count < /proc/self/uid_map
            test "$inner:$outer:$count" = 0:0:1
            read -r inner outer count < /proc/self/gid_map
            test "$inner:$outer:$count" = 0:0:1
            test "$(ip -o link show | wc -l)" -eq 1
            test -z "$(ip -4 route show)"
            test -z "$(ip -6 route show)"
            # mkosi changes / mount propagation before creating its sandbox.
            # A plain chroot directory is not a mount point for that operation.
            mount --bind "$root" "$root"
            mountpoint -q "$root"
            test -d "$root/proc" && test ! -L "$root/proc"
            mount -t proc proc "$root/proc"
            /usr/bin/env -i PATH=/usr/bin:/bin HOME=/nonexistent \
              LC_ALL=C PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 \
              "$6" "$root" /usr/bin/mkosi-sandbox \
                --ro-bind / / --unshare-net -- /usr/bin/true
            echo "Packaged mkosi sandbox true-command: passed in root-owned no-route namespace"
          ' _ "$root_scratch" "$parent_user_ns" "$parent_mount_ns" \
            "$parent_net_ns" "$parent_pid_ns" "$chroot_command"

          printf '%s\n' '{"status":"diagnostic-packaged-mkosi-sandbox-passed-unbuilt","package_scripts_executed":false,"image_built":false,"approved_release":false,"private_mode_approved":false}'
