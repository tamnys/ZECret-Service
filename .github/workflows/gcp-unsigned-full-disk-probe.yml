name: GCP unsigned synthetic full-disk diagnostic

on:
  workflow_dispatch:
    inputs:
      prepare_boot_diagnostic:
        description: Prepare exact-commit native early init for a synthetic boot diagnostic
        required: true
        default: false
        type: boolean
      observe_boot:
        description: Launch the unsigned synthetic disk in isolated QEMU; diagnostic only
        required: true
        default: false
        type: boolean
      tamper_root_data:
        description: Boot a disposable one-byte root-data mutation; synthetic negative only
        required: true
        default: false
        type: boolean
      signed_synthetic_boot:
        description: Sign a synthetic-service disk with an ephemeral tmpfs key; no release approval
        required: true
        default: false
        type: boolean
      compare_rebuild:
        description: Build twice and report root and full-disk byte differences
        required: true
        default: false
        type: boolean
      qemu_memory_mib:
        description: Explicit guest RAM for optional QEMU observation, in MiB
        required: false
        type: string
      qemu_vcpus:
        description: Explicit vCPU count for optional QEMU observation
        required: false
        type: string
      qemu_deadline_seconds:
        description: Explicit observation deadline for optional QEMU, in seconds
        required: false
        type: string
      qemu_capture_seconds:
        description: Optional comma-separated VGA capture offsets before the deadline
        required: false
        type: string
      native_rust_run_id:
        description: Successful exact-HEAD native Rust workflow run ID for boot-test preparation
        required: false
        type: string
      native_rust_run_attempt:
        description: Successful native Rust run attempt for boot-test preparation
        required: false
        type: string
      native_rust_artifact_digest:
        description: Independently recorded SHA-256 of native Rust artifact ZIP
        required: false
        type: string
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/gcp-unsigned-full-disk-probe.yml
      - deploy/gcp/boot-toolchain.lock.json
      - deploy/gcp/guest/**
      - tools/gcp-guest/**

permissions:
  actions: read

jobs:
  diagnostic:
    name: Native x86_64 diagnostic disk, no private approval
    runs-on: ubuntu-24.04
    env:
      ZRPC_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ZRPC_PREPARE_BOOT_DIAGNOSTIC: ${{ github.event_name == 'workflow_dispatch' && inputs.prepare_boot_diagnostic || false }}
      ZRPC_OBSERVE_BOOT: ${{ github.event_name == 'workflow_dispatch' && inputs.observe_boot || false }}
      ZRPC_TAMPER_ROOT_DATA: ${{ github.event_name == 'workflow_dispatch' && inputs.tamper_root_data || false }}
      ZRPC_SIGNED_SYNTHETIC_BOOT: ${{ github.event_name == 'workflow_dispatch' && inputs.signed_synthetic_boot || false }}
      ZRPC_COMPARE_REBUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.compare_rebuild || false }}
      ZRPC_QEMU_MEMORY_MIB: ${{ inputs.qemu_memory_mib }}
      ZRPC_QEMU_VCPUS: ${{ inputs.qemu_vcpus }}
      ZRPC_QEMU_DEADLINE_SECONDS: ${{ inputs.qemu_deadline_seconds }}
      ZRPC_QEMU_CAPTURE_SECONDS: ${{ inputs.qemu_capture_seconds }}
      ZRPC_RUST_RUN_ID: ${{ inputs.native_rust_run_id }}
      ZRPC_RUST_RUN_ATTEMPT: ${{ inputs.native_rust_run_attempt }}
      ZRPC_RUST_ARTIFACT_DIGEST: ${{ inputs.native_rust_artifact_digest }}
    steps:
      - name: Fetch exact public source
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          source="$GITHUB_WORKSPACE/source"
          scratch="$GITHUB_WORKSPACE/full-disk"
          mkdir "$source" "$scratch" "$scratch/builder-archives" \
            "$scratch/guest-archives" "$scratch/metadata"
          git -C "$source" init -q
          git -C "$source" fetch -q --no-tags --depth=1 \
            "https://github.com/$GITHUB_REPOSITORY.git" "$ZRPC_SOURCE_SHA"
          test "$(git -C "$source" rev-parse FETCH_HEAD)" = "$ZRPC_SOURCE_SHA"
          git -C "$source" checkout -q --detach FETCH_HEAD
          test -z "$(git -C "$source" status --porcelain --untracked-files=all --ignored)"

      - name: Validate optional QEMU observation selection
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          import os
          import re

          prepare = os.environ["ZRPC_PREPARE_BOOT_DIAGNOSTIC"]
          observe = os.environ["ZRPC_OBSERVE_BOOT"]
          tamper = os.environ["ZRPC_TAMPER_ROOT_DATA"]
          signed = os.environ["ZRPC_SIGNED_SYNTHETIC_BOOT"]
          compare = os.environ["ZRPC_COMPARE_REBUILD"]
          values = (os.environ["ZRPC_QEMU_MEMORY_MIB"],
                    os.environ["ZRPC_QEMU_VCPUS"],
                    os.environ["ZRPC_QEMU_DEADLINE_SECONDS"])
          captures = os.environ["ZRPC_QEMU_CAPTURE_SECONDS"]
          if any(value not in ("true", "false") for value in (prepare, observe,
                                                              tamper, signed, compare)):
              raise ValueError("diagnostic selection is malformed")
          if signed == "true" and (prepare != "true" or observe != "false"
                                   or tamper != "false" or compare != "false"):
              raise ValueError("signed synthetic diagnostic requires native receipt and no QEMU or rebuild mode")
          if compare == "true" and prepare != "false":
              raise ValueError("root rebuild comparison requires the synthetic non-boot disk")
          if tamper == "true" and observe != "true":
              raise ValueError("root-data tamper requires QEMU observation")
          if observe == "true":
              if prepare != "true" or any(re.fullmatch(r"[1-9][0-9]*", value) is None
                                          for value in values):
                  raise ValueError("QEMU observation requires boot preparation and explicit positive resources/deadline")
              if captures:
                  if re.fullmatch(r"[1-9][0-9]*(,[1-9][0-9]*)*", captures) is None:
                      raise ValueError("QEMU capture offsets are malformed")
                  offsets = [int(value) for value in captures.split(",")]
                  if offsets != sorted(set(offsets)) or offsets[-1] >= int(values[2]):
                      raise ValueError("QEMU capture offsets must increase before the deadline")
          elif any(values) or captures:
              raise ValueError("QEMU resource inputs require observation selection")
          PY

      - name: Test QEMU and raw-disk inspection guards
        shell: bash
        run: |
          set -euo pipefail
          source="$GITHUB_WORKSPACE/source"
          python3 -B "$source/tools/gcp-guest/test_boot_observe_qemu.py"
          python3 -B "$source/tools/gcp-guest/test_qemu_isolation.py"
          python3 -B "$source/tools/gcp-guest/test_inspect_raw_package_components.py"
          python3 -B "$source/tools/gcp-guest/test_inspect_raw_forbidden.py"
          python3 -B "$source/tools/gcp-guest/test_inspect_raw_rootfs.py"
          python3 -B "$source/tools/gcp-guest/test_outer_image_runner.py"
          test -z "$(git -C "$source" status --porcelain --untracked-files=all --ignored)"

      - name: Fetch selected exact-commit native Rust receipt for boot-test preparation
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.prepare_boot_diagnostic }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source="$GITHUB_WORKSPACE/source"
          scratch="$GITHUB_WORKSPACE/full-disk"
          test "$(git -C "$source" rev-parse HEAD)" = "$ZRPC_SOURCE_SHA"
          python3 -I -B "$source/tools/gcp-guest/fetch_native_rust_receipt.py" \
            --repository "$GITHUB_REPOSITORY" \
            --revision "$ZRPC_SOURCE_SHA" \
            --run-id "$ZRPC_RUST_RUN_ID" \
            --run-attempt "$ZRPC_RUST_RUN_ATTEMPT" \
            --artifact-digest "$ZRPC_RUST_ARTIFACT_DIGEST" \
            --output "$scratch/native-rust"
          test -z "$(git -C "$source" status --porcelain --untracked-files=all --ignored)"

      - name: Fetch locked signed snapshot inputs and stage reviewed builder
        shell: bash
        run: |
          set -euo pipefail
          source="$GITHUB_WORKSPACE/source"
          scratch="$GITHUB_WORKSPACE/full-disk"
          test "$(git -C "$source" rev-parse HEAD)" = "$ZRPC_SOURCE_SHA"
          cd "$source"
          ZRPC_SCRATCH="$scratch" python3 -I -B - <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          sys.path.insert(0, str(Path.cwd() / "tools/gcp-guest"))
          import fetch_builder_closure as builder
          import fetch_guest_closure as guest

          scratch = Path(os.environ["ZRPC_SCRATCH"])
          lock, _, _ = builder.reviewed_lock(builder.closure.LOCK)
          descriptor = os.open(scratch / "builder-archives", os.O_RDONLY |
                               os.O_DIRECTORY | os.O_NOFOLLOW | os.O_CLOEXEC)
          try:
              for package in lock["packages"]:
                  builder.download_one(descriptor, package, lock["snapshot"])
                  if not builder.verify_cached(descriptor, package):
                      raise ValueError("reviewed builder archive changed")
          finally:
              os.close(descriptor)
          builder.fetch_reviewed_metadata(scratch / "metadata")
          guest.prefetch_archives(scratch / "guest-archives")
          print(json.dumps({"status": "diagnostic-locked-inputs-fetched-unbuilt",
                            "builder_archives": len(lock["packages"]),
                            "private_mode_approved": False}, sort_keys=True))
          PY
          CODEX_WORKSPACE_DIR="$GITHUB_WORKSPACE" \
            python3 -B tools/gcp-guest/stage_builder_toolchain.py \
              --archives "$scratch/builder-archives" --output "$scratch/staged"
          if test "$ZRPC_PREPARE_BOOT_DIAGNOSTIC" = true; then
            python3 -I -B tools/gcp-guest/boot_qemu_toolchain.py fetch \
              --metadata "$scratch/metadata" \
              --archives "$scratch/builder-archives"
          else
            test "$ZRPC_PREPARE_BOOT_DIAGNOSTIC" = false
          fi
          test -z "$(git -C "$source" status --porcelain --untracked-files=all --ignored)"

      - name: Build and inspect unsigned synthetic full disk in no-route namespace
        shell: bash
        run: |
          set -euo pipefail
          source="$GITHUB_WORKSPACE/source"
          scratch="$GITHUB_WORKSPACE/full-disk"
          test "$(git -C "$source" rev-parse HEAD)" = "$ZRPC_SOURCE_SHA"
          test -z "$(git -C "$source" status --porcelain --untracked-files=all --ignored)"
          root_stage="/var/tmp/zrpc-full-disk-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$root_stage"
          sudo -n install -d -m 0700 "$root_stage"
          sudo -n cp -a -- "$source" "$scratch" "$root_stage/"
          sudo -n chown -hR 0:0 -- "$root_stage"
          source="$root_stage/source"
          scratch="$root_stage/full-disk"
          staged="$scratch/staged"
          test "$(sudo -n git -C "$source" rev-parse HEAD)" = "$ZRPC_SOURCE_SHA"
          test -z "$(sudo -n git -C "$source" status --porcelain --untracked-files=all --ignored)"
          parent_user_ns="$(readlink /proc/self/ns/user)"
          parent_mount_ns="$(readlink /proc/self/ns/mnt)"
          parent_net_ns="$(readlink /proc/self/ns/net)"
          parent_pid_ns="$(readlink /proc/self/ns/pid)"
          chroot_command="$(command -v chroot)"
          sudo -n /usr/bin/python3 -I -B \
            "$source/tools/gcp-guest/probe_builder_owner_map.py" \
            --scratch "/var/tmp/zrpc-owner-map-full-disk-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -- /usr/bin/bash -c '
            set -euo pipefail
            if test "$#" -ne 13; then
              echo "namespace handoff argument count differs" >&2
              exit 1
            fi
            staged=$1
            source=$7
            scratch=$8
            chroot_command=${10}
            boot_diagnostic=${11}
            compare_rebuild=${12}
            signed_synthetic_boot=${13}
            test "$staged" = "$scratch/staged"
            test "$(readlink /proc/self/ns/user)" != "$2"
            test "$(readlink /proc/self/ns/mnt)" != "$3"
            test "$(readlink /proc/self/ns/net)" != "$4"
            test "$(readlink /proc/self/ns/pid)" != "$5"
            test "$(readlink /proc/1/ns/pid)" = "$(readlink /proc/self/ns/pid)"
            test "$(awk '\''{print $1 " " $2 " " $3}'\'' /proc/self/uid_map)" = "0 0 1"
            test "$(awk '\''{print $1 " " $2 " " $3}'\'' /proc/self/gid_map | sort -n)" = "$(printf "0 0 1\\n42 42 1")"
            test "$(cat /proc/self/setgroups)" = deny
            test "$(ip -o link show | wc -l)" -eq 1
            test -z "$(ip -4 route show)"
            test -z "$(ip -6 route show)"
            for fd in /proc/$$/fd/*; do
              target=$(readlink "$fd") || exit 1
              case "$target" in socket:*) exit 1;; esac
            done
            test ! -L "$staged"
            mount --bind "$staged" "$staged"
            mountpoint -q "$staged"
            mkdir -m 0700 "$scratch/apt-scratch" "$scratch/diagnostic-work" \
              "$scratch/guest-payload"
            if test "$boot_diagnostic" = true; then
              cp -a -- "$scratch/native-rust/verified/rust-bundle" \
                "$scratch/guest-payload/rust-bundle"
            fi
            mkdir -m 0700 "$source/.codex-tmp" "$scratch/guest-payload/source"
            for directory in workspace zrpc-archives zrpc-metadata zrpc-guest-archives \
                             zrpc-apt-scratch proc dev; do
              test ! -L "$staged/$directory"
              mkdir -p "$staged/$directory"
            done
            if test "$signed_synthetic_boot" = true; then
              test "$boot_diagnostic" = true
              test ! -e "$staged/run/zrpc-build-signing"
              mkdir -m 0700 "$staged/run/zrpc-build-signing"
              mount -t tmpfs -o mode=0700,nodev,nosuid,noexec tmpfs \
                "$staged/run/zrpc-build-signing"
            fi
            mount --bind "$scratch/apt-scratch" "$staged/zrpc-apt-scratch"
            mkdir -m 0700 "$staged/zrpc-apt-scratch/tmp"
            mount --bind "$scratch/guest-payload" "$staged/workspace"
            mount --bind "$source" "$staged/workspace/source"
            mount -o remount,bind,ro "$staged/workspace/source"
            if test "$boot_diagnostic" = true; then
              test -d "$staged/workspace/rust-bundle"
              test ! -L "$staged/workspace/rust-bundle"
              mount --bind "$scratch/guest-payload/rust-bundle" \
                "$staged/workspace/rust-bundle"
              mount -o remount,bind,ro "$staged/workspace/rust-bundle"
            fi
            mount --bind "$scratch/diagnostic-work" \
              "$staged/workspace/source/.codex-tmp"
            pairs=("$scratch/builder-archives:zrpc-archives"
                   "$scratch/metadata:zrpc-metadata"
                   "$scratch/guest-archives:zrpc-guest-archives")
            for pair in "${pairs[@]}"; do
              origin=${pair%%:*}
              target=${pair#*:}
              mount --bind "$origin" "$staged/$target"
              mount -o remount,bind,ro "$staged/$target"
            done
            mount -t proc proc "$staged/proc"
            for device in null zero full random urandom tty; do
              test -c "/dev/$device"
              test ! -e "$staged/dev/$device"
              touch "$staged/dev/$device"
              mount --bind "/dev/$device" "$staged/dev/$device"
            done
            mount -o remount,bind,ro "$staged"
            for readable in "$staged" "$staged/workspace/source"; do
              case ",$(findmnt -n -o OPTIONS --target "$readable")," in
                *,ro,*) ;;
                *) exit 1 ;;
              esac
            done
            if test "$boot_diagnostic" = true; then
              case ",$(findmnt -n -o OPTIONS --target "$staged/workspace/rust-bundle")," in
                *,ro,*) ;;
                *) exit 1 ;;
              esac
            fi
            for writable in zrpc-apt-scratch workspace workspace/source/.codex-tmp; do
              case ",$(findmnt -n -o OPTIONS --target "$staged/$writable")," in
                *,rw,*) ;;
                *) exit 1 ;;
              esac
            done
            run_staged() {
              /usr/bin/env -i PATH=/usr/bin:/bin HOME=/nonexistent LC_ALL=C \
                PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 \
                TMPDIR=/zrpc-apt-scratch/tmp \
                "$chroot_command" "$staged" "$@"
            }
            if test "$signed_synthetic_boot" = true; then
              umask 077
              run_staged /usr/bin/openssl req -new -x509 -newkey rsa:2048 \
                -sha256 -noenc -days 1 -config /dev/null \
                -subj /CN=ZRPC-SYNTHETIC-UNAPPROVED \
                -keyout /run/zrpc-build-signing/secure-boot.key \
                -out /workspace/source/.codex-tmp/diagnostic-cert.pem
              chmod 0600 "$staged/run/zrpc-build-signing/secure-boot.key"
              test -s "$scratch/diagnostic-work/diagnostic-cert.pem"
            fi
            run_staged /usr/bin/python3 -I -B - <<"PY"
          import json
          import hashlib
          from pathlib import Path
          import sys
          import tempfile
          import types

          sys.path.insert(0, "/workspace/source/tools/gcp-guest")
          import fetch_guest_closure as guest
          import outer_image_runner as outer
          import prepare_import_disk as importer
          import test_inspect_raw_gpt as fixture

          context = types.SimpleNamespace(
              source=types.SimpleNamespace(guest=guest), import_disk=importer)
          checked, runtime = outer.checked_sfdisk_package(
              context, Path("/zrpc-metadata"), Path("/zrpc-archives"),
              Path("/usr/sbin/sfdisk"))
          if checked != {
                  "sfdisk_sha256": importer.SFDISK_SHA256,
                  "sfdisk_package_archive_sha256": importer.SFDISK_PACKAGE_SHA256,
                  "sfdisk_archive_membership_rechecked": True,
                  "sfdisk_dynamic_runtime_authenticated": False}:
              raise ValueError("signed sfdisk package diagnostic changed")
          scratch = Path("/workspace/source/.codex-tmp")
          outer.signed_sfdisk_runtime(runtime, scratch)
          with tempfile.TemporaryDirectory(prefix="sfdisk-gpt-probe-", dir=scratch) as temporary:
              root = Path(temporary)
              source = root / "zrpc-gcp.raw"
              original = fixture.synthetic_disk()
              source.write_bytes(original)
              prepared = importer._prepare(
                  source, hashlib.sha256(original).hexdigest(), len(original),
                  root / "disk.raw", Path("/usr/sbin/sfdisk"),
                  sfdisk_runner=lambda disk: outer.signed_sfdisk_runtime(runtime, root, disk))
              if (prepared.get("status") != "diagnostic-import-sized-gpt-unapproved"
                      or prepared.get("old_backup_gpt_removed") is not True
                      or prepared.get("private_mode_approved") is not False):
                  raise ValueError("sealed sfdisk GPT relocation diagnostic changed")
          print(json.dumps({"status": "diagnostic-signed-sfdisk-package-matched-unapproved",
                            **checked, "signed_initial_elf_objects_checked": True,
                            "synthetic_gpt_relocated": True,
                            "private_mode_approved": False}, sort_keys=True))
          PY
            tool=/workspace/source/tools/gcp-guest/diagnostic_full_disk.py
            prefix=(--metadata /zrpc-metadata \
                    --guest-archives /zrpc-guest-archives \
                    --inputs /workspace/source/.codex-tmp/inputs \
                    --lock /workspace/source/.codex-tmp/inputs.lock.json)
            receipt=()
            if test "$boot_diagnostic" = true; then
              if test "$signed_synthetic_boot" = true; then
                create_mode=create-signed-boot-inputs
                build_mode=build-signed-boot
                certificate=(--certificate \
                  /workspace/source/.codex-tmp/diagnostic-cert.pem)
              else
                create_mode=create-boot-inputs
                build_mode=build-boot
                certificate=()
              fi
              receipt=(--rust-bundle /workspace/rust-bundle --revision "$9")
            elif test "$boot_diagnostic" = false; then
              create_mode=create-inputs
              build_mode=build
              certificate=()
            else
              echo "Invalid boot diagnostic selection" >&2
              exit 1
            fi
            run_staged /usr/bin/python3 -I -B "$tool" "$create_mode" \
              "${prefix[@]}" "${receipt[@]}" "${certificate[@]}"
            build=(/usr/bin/python3 -I -B "$tool" "$build_mode" \
                   "${prefix[@]}" "${receipt[@]}" \
                   --stage /workspace/source/.codex-tmp/stage \
                   --builder-archives /zrpc-archives --workspace /workspace \
                   --apt-scratch /zrpc-apt-scratch \
                   --parent-net-ns "$4" --parent-user-ns "$2" --parent-pid-ns "$5")
            if test "$boot_diagnostic" = true; then
              run_staged "${build[@]}" | tee "$scratch/diagnostic-build.log"
              if test "$signed_synthetic_boot" = true; then
                tail -n 1 "$scratch/diagnostic-build.log" \
                  > "$scratch/guest-payload/signed-disk-report.json"
              else
                tail -n 1 "$scratch/diagnostic-build.log" \
                  > "$scratch/guest-payload/boot-disk-report.json"
              fi
            else
              run_staged "${build[@]}"
            fi
            if test "$compare_rebuild" = true; then
              test "$boot_diagnostic" = false
              run_staged /usr/bin/python3 -I -B "$tool" build \
                "${prefix[@]}" \
                --stage /workspace/source/.codex-tmp/stage-repeat \
                --builder-archives /zrpc-archives --workspace /workspace \
                --apt-scratch /zrpc-apt-scratch \
                --parent-net-ns "$4" --parent-user-ns "$2" --parent-pid-ns "$5"
              run_staged /usr/bin/python3 -I -B "$tool" compare-roots \
                --first-stage /workspace/source/.codex-tmp/stage \
                --second-stage /workspace/source/.codex-tmp/stage-repeat \
                --metadata /zrpc-metadata --builder-archives /zrpc-archives \
                --workspace /workspace
            fi
            if test "$boot_diagnostic" = true && test "$signed_synthetic_boot" = false; then
              mkdir -m 0700 "$staged/workspace/boot-apt-scratch"
              run_staged /usr/bin/python3 -I -B \
                /workspace/source/tools/gcp-guest/boot_qemu_toolchain.py stage \
                --metadata /zrpc-metadata \
                --archives /zrpc-archives \
                --output /workspace/boot-toolchain \
                --scratch /workspace/boot-apt-scratch --workspace /workspace \
                | tee "$scratch/qemu-stage.log"
              tail -n 1 "$scratch/qemu-stage.log" \
                > "$scratch/guest-payload/boot-toolchain-stage.json"
            fi
            echo "::warning::Synthetic-service disk is diagnostic only; never approved for private mode."
          ' _ "$staged" "$parent_user_ns" "$parent_mount_ns" \
            "$parent_net_ns" "$parent_pid_ns" \
            "$root_stage" "$source" "$scratch" \
            "$ZRPC_SOURCE_SHA" "$chroot_command" "$ZRPC_PREPARE_BOOT_DIAGNOSTIC" \
            "$ZRPC_COMPARE_REBUILD" "$ZRPC_SIGNED_SYNTHETIC_BOOT"
          if test "$ZRPC_SIGNED_SYNTHETIC_BOOT" = true; then
            sudo -n install -m 0644 \
              "$root_stage/full-disk/guest-payload/signed-disk-report.json" \
              "$GITHUB_WORKSPACE/signed-disk-report.json"
          fi
          echo "Exact source: $ZRPC_SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'Result: synthetic-service full-disk diagnostic; optional signing uses a throwaway tmpfs key; no TDX or private-mode approval.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload synthetic signed-UKI diagnostic report
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.signed_synthetic_boot }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gcp-signed-synthetic-${{ github.run_id }}-${{ github.run_attempt }}
          path: signed-disk-report.json
          if-no-files-found: warn

      - name: Observe optional unsigned boot in isolated QEMU
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.observe_boot }}
        shell: bash
        run: |
          set -euo pipefail
          test "$ZRPC_OBSERVE_BOOT" = true
          test "$ZRPC_PREPARE_BOOT_DIAGNOSTIC" = true
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          test "$runner_uid" -gt 0
          test "$runner_gid" -gt 0
          root_stage="/var/tmp/zrpc-full-disk-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          source="$root_stage/source"
          scratch="$root_stage/full-disk"
          toolchain="$scratch/guest-payload/boot-toolchain"
          output="$toolchain/observe"
          observer="$source/tools/gcp-guest/qemu_isolation.py"
          test "$(sudo -n git -C "$source" rev-parse HEAD)" = "$ZRPC_SOURCE_SHA"
          sudo -n git -C "$source" diff --exit-code HEAD -- \
            tools/gcp-guest/qemu_isolation.py tools/gcp-guest/boot_observe_qemu.py
          sudo -n git -C "$source" ls-files --error-unmatch -- \
            tools/gcp-guest/qemu_isolation.py tools/gcp-guest/boot_observe_qemu.py
          evidence="$GITHUB_WORKSPACE/boot-observation"
          install -d -m 0700 "$evidence"
          capture_args=()
          if test -n "$ZRPC_QEMU_CAPTURE_SECONDS"; then
            IFS=, read -r -a offsets <<< "$ZRPC_QEMU_CAPTURE_SECONDS"
            for offset in "${offsets[@]}"; do
              capture_args+=(--capture-at-seconds "$offset")
            done
          fi
          tamper_args=()
          if test "$ZRPC_TAMPER_ROOT_DATA" = true; then
            tamper_args+=(--tamper-root-data)
          fi
          set +e
          sudo -n /usr/bin/python3 -I -B "$observer" run \
            --toolchain-root "$toolchain" \
            --toolchain-report "$scratch/guest-payload/boot-toolchain-stage.json" \
            --disk "$scratch/diagnostic-work/stage/output/zrpc-gcp.raw" \
            --disk-report "$scratch/guest-payload/boot-disk-report.json" \
            --output "$output" \
            --memory-mib "$ZRPC_QEMU_MEMORY_MIB" \
            --vcpus "$ZRPC_QEMU_VCPUS" \
            --deadline-seconds "$ZRPC_QEMU_DEADLINE_SECONDS" \
            --qemu-uid "$runner_uid" --qemu-gid "$runner_gid" \
            "${capture_args[@]}" \
            "${tamper_args[@]}" \
            | tee "$evidence/observer.stdout.jsonl"
          statuses=("${PIPESTATUS[@]}")
          set -e
          if sudo -n test -d "$output"; then
            for name in observation.json qemu.log; do
              if sudo -n test -f "$output/$name" && sudo -n test ! -L "$output/$name"; then
                sudo -n install -m 0644 "$output/$name" "$evidence/$name"
              fi
            done
            sudo -n find "$output" -maxdepth 1 -type f -name 'vga-*.ppm' -print0 \
              > "$GITHUB_WORKSPACE/full-disk/qemu-frame-paths"
            while IFS= read -r -d '' frame; do
              if sudo -n test -f "$frame" && sudo -n test ! -L "$frame"; then
                sudo -n install -m 0644 "$frame" "$evidence/$(basename "$frame")"
              fi
            done < "$GITHUB_WORKSPACE/full-disk/qemu-frame-paths"
          fi
          test "${statuses[0]}" -eq 0
          test "${statuses[1]}" -eq 0
          echo 'QEMU generated diagnostic evidence only; boot, TDX and private-mode approval remain false.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload synthetic boot observation
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.observe_boot }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gcp-unsigned-qemu-${{ github.run_id }}-${{ github.run_attempt }}
          path: boot-observation/
          if-no-files-found: warn
