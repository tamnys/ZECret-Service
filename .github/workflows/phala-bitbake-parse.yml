name: Phala native corrected guest source preflight

on:
  workflow_dispatch:
    inputs:
      worker_task_smoke:
        description: Exercise one local-source BitBake task under a job-scoped AppArmor profile
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

jobs:
  parse:
    name: Native x86_64 candidate parse and dependency graph
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch exact project and meta-dstack source objects
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          export GIT_LFS_SKIP_SMUDGE=1
          source="$GITHUB_WORKSPACE/source"
          scratch="$source/.codex-tmp/phala-bitbake-parse"
          mkdir -p "$source"
          git -C "$source" init -q
          git -c core.hooksPath=/dev/null -C "$source" fetch -q --no-tags --depth=1 \
            "https://github.com/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          test "$(git -C "$source" rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git -c core.hooksPath=/dev/null -C "$source" checkout -q --detach FETCH_HEAD

          fetch_pinned() {
            local name="$1" url="$2" commit="$3"
            local directory="$scratch/sources/$name"
            mkdir -p "$directory"
            git -C "$directory" init -q
            git -c core.hooksPath=/dev/null -C "$directory" fetch -q \
              --no-tags --depth=1 "$url" "$commit"
            test "$(git -C "$directory" rev-parse FETCH_HEAD)" = "$commit"
            git -c core.hooksPath=/dev/null -C "$directory" checkout -q --detach FETCH_HEAD
            test "$(git -C "$directory" rev-parse HEAD)" = "$commit"
          }

          fetch_pinned meta-dstack https://github.com/Dstack-TEE/meta-dstack.git e3655d1390feee3736476f4bda35c4354b4a12fc
          fetch_pinned dstack https://github.com/Dstack-TEE/dstack 282eeb27d22d8f091ad0fa5a90e638f85cf68751
          fetch_pinned poky https://github.com/yoctoproject/poky.git cd44e6bd40b0c1f498b3feaeb5e9b72f8bf32d41
          fetch_pinned meta-confidential-compute https://github.com/Dstack-TEE/meta-confidential-compute.git 6d1355e0c684f7fdfb688ecfef0ed63feb2aac4c
          fetch_pinned meta-openembedded https://github.com/openembedded/meta-openembedded 72018ca1b1a471226917e8246e8bbf9a374ccf97
          fetch_pinned meta-rust-bin https://github.com/rust-embedded/meta-rust-bin 79c077fac9694eb5fbcee7b15e800c21e887bb5d
          fetch_pinned meta-security https://github.com/Dstack-TEE/meta-security.git bc63d95746ef4f0ac6820165e5041d83647e8c9c
          fetch_pinned meta-virtualization https://github.com/Dstack-TEE/meta-virtualization.git 52cd8a290cf3989bc99bd9eb475b5db88000245a

      - name: Retrieve exact native guest binaries and ABI receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          scratch="$GITHUB_WORKSPACE/source/.codex-tmp/phala-bitbake-parse"
          mkdir -p "$scratch/native-binaries"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/11139816826" > "$scratch/native-artifact-metadata.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/11139816826/zip" > "$scratch/native-artifact.zip"
          python3 -I - "$scratch" <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import sys
          import zipfile

          scratch = Path(sys.argv[1])
          metadata = json.loads((scratch / "native-artifact-metadata.json").read_bytes())
          commit = "6bc4f6beea70f99b2aa112110554a6a8ff898d48"
          expected_zip = "a0f25173c9723a0c87b5b7c22708adb64b85173289256999607fa0c1ad1815f7"
          if (metadata.get("id") != 11139816826
                  or metadata.get("name") != f"phala-guest-abi-{commit}"
                  or metadata.get("digest") != f"sha256:{expected_zip}"
                  or metadata.get("expired") is not False
                  or metadata.get("workflow_run", {}).get("id") != 36812042568
                  or metadata.get("workflow_run", {}).get("head_sha") != commit):
              raise SystemExit("native guest ABI artifact identity differs")
          archive = scratch / "native-artifact.zip"
          with archive.open("rb") as stream:
              if hashlib.file_digest(stream, "sha256").hexdigest() != expected_zip:
                  raise SystemExit("native guest ABI artifact ZIP differs")
          expected = {
              "phala-runtime-guard": "56255740e6364f67d090d7ccb8ca29c015ce6f45fa0c93ba109e765583250bc9",
              "zrpc-quote-proxy": "6e0a33f7a2aeadb3102c7af89135f0a5e13dea09641c6a86c65727f635308186",
          }
          with zipfile.ZipFile(archive) as bundle:
              names = {"receipt.json"} | {"native-binaries/" + name for name in expected}
              if set(bundle.namelist()) != names:
                  raise SystemExit("native guest ABI artifact members differ")
              receipt_bytes = bundle.read("receipt.json")
              receipt = json.loads(receipt_bytes)
              if (receipt.get("source_commit") != commit
                      or receipt.get("guard_double_build_equal") is not True
                      or receipt.get("stock_loader_denial_smoke_passed") is not True
                      or receipt.get("corrected_guest_image_built") is not False
                      or receipt.get("hardware_tested") is not False
                      or receipt.get("private_accepted") is not False
                      or receipt.get("guard_sha256") != expected["phala-runtime-guard"]
                      or receipt.get("quote_proxy_sha256") != expected["zrpc-quote-proxy"]):
                  raise SystemExit("native guest ABI receipt differs")
              for name, digest in expected.items():
                  payload = bundle.read("native-binaries/" + name)
                  if hashlib.sha256(payload).hexdigest() != digest:
                      raise SystemExit(f"native guest binary differs: {name}")
                  path = scratch / "native-binaries" / name
                  path.write_bytes(payload)
                  path.chmod(0o555)
          (scratch / "native-input-receipt.json").write_bytes(receipt_bytes)
          PY

      - name: Reconstruct source-only candidate with native ABI-smoked binaries
        shell: bash
        run: |
          set -euo pipefail
          source="$GITHUB_WORKSPACE/source"
          scratch="$source/.codex-tmp/phala-bitbake-parse"
          python3 -I "$source/experiments/ephemeral-runtime/prepare-packaging-source.py" \
            "$scratch/sources/dstack" \
            "$scratch/sources/meta-dstack" \
            "$scratch/candidate" \
            --runtime-guard "$scratch/native-binaries/phala-runtime-guard" \
            --runtime-guard-sha256 56255740e6364f67d090d7ccb8ca29c015ce6f45fa0c93ba109e765583250bc9 \
            --quote-proxy "$scratch/native-binaries/zrpc-quote-proxy" \
            --quote-proxy-sha256 6e0a33f7a2aeadb3102c7af89135f0a5e13dea09641c6a86c65727f635308186 \
            --poky-source "$scratch/sources/poky" \
            --meta-confidential-compute-source "$scratch/sources/meta-confidential-compute" \
            --meta-openembedded-source "$scratch/sources/meta-openembedded" \
            --meta-rust-bin-source "$scratch/sources/meta-rust-bin" \
            --meta-security-source "$scratch/sources/meta-security" \
            --meta-virtualization-source "$scratch/sources/meta-virtualization"
          python3 -I - "$scratch/candidate/packaging-manifest.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          manifest = json.loads(Path(sys.argv[1]).read_bytes())
          if (manifest["runtime_guard_sha256"] !=
                  "56255740e6364f67d090d7ccb8ca29c015ce6f45fa0c93ba109e765583250bc9"
                  or manifest["quote_proxy_sha256"] !=
                  "6e0a33f7a2aeadb3102c7af89135f0a5e13dea09641c6a86c65727f635308186"
                  or manifest["guest_launch_profile_bound"]
                  or manifest["binary_provenance_verified"]
                  or manifest["bitbake_executed"]
                  or manifest["private_accepted"]
                  or manifest["unresolved_meta_gitlinks"]):
              raise SystemExit("source-only candidate unexpectedly claims release evidence")
          print("Checked source-only candidate reconstructed with native ABI-smoked binaries; private approval remains false.")
          PY

      - name: Stage exact Ubuntu host tools without installing packages
        shell: bash
        run: |
          set -euo pipefail
          scratch="$GITHUB_WORKSPACE/source/.codex-tmp/phala-bitbake-parse"
          mkdir -p "$scratch/packages" "$scratch/hosttools-root" "$scratch/hosttools/bin"
          python3 -I - "$scratch/packages" <<'PY'
          import hashlib
          from pathlib import Path
          import sys
          import urllib.request

          destination = Path(sys.argv[1])
          # Exact Noble amd64 identities from packages.ubuntu.com. Download
          # bytes are checked before dpkg-deb extracts them; no package hooks run.
          packages = {
              "chrpath_0.16-2build1_amd64.deb": (
                  "https://archive.ubuntu.com/ubuntu/pool/universe/c/chrpath/chrpath_0.16-2build1_amd64.deb",
                  12754,
                  "3711df193e4a970ddd3cf786d0ba56ee59735be5ee2c1bf73d365d4ae7e1b85f",
              ),
              "diffstat_1.66-1build1_amd64.deb": (
                  "https://archive.ubuntu.com/ubuntu/pool/main/d/diffstat/diffstat_1.66-1build1_amd64.deb",
                  29688,
                  "e4a1530fed8990fb04fa92d6021cb4dcbd6e09ff943e629a5a17d5bf8de6ab79",
              ),
          }
          for name, (url, size, expected_sha256) in packages.items():
              with urllib.request.urlopen(url) as response:
                  payload = response.read(size + 1)
              if (len(payload) != size
                      or hashlib.sha256(payload).hexdigest() != expected_sha256):
                  raise SystemExit(f"pinned Ubuntu host tool differs: {name}")
              (destination / name).write_bytes(payload)
          PY
          dpkg-deb -x "$scratch/packages/chrpath_0.16-2build1_amd64.deb" "$scratch/hosttools-root"
          dpkg-deb -x "$scratch/packages/diffstat_1.66-1build1_amd64.deb" "$scratch/hosttools-root"
          install -m 0555 "$scratch/hosttools-root/usr/bin/chrpath" "$scratch/hosttools/bin/chrpath"
          install -m 0555 "$scratch/hosttools-root/usr/bin/diffstat" "$scratch/hosttools/bin/diffstat"

      - name: Parse all pinned layers without fetching or building
        shell: bash
        run: |
          set -euo pipefail
          source="$GITHUB_WORKSPACE/source"
          scratch="$source/.codex-tmp/phala-bitbake-parse"
          staged="$scratch/candidate/staged-source"
          build="$scratch/build"
          export PATH="$scratch/hosttools/bin:$PATH"
          python3 -I - <<'PY'
          import os
          if os.statvfs("/tmp").f_flag & os.ST_NOEXEC:
              raise SystemExit("native runner /tmp is noexec; pinned BitBake refuses to parse")
          PY
          # Pinned oe-init-build-env reads optional unset shell variables such
          # as BBSERVER. Restore nounset before any candidate configuration.
          set +u
          . "$staged/poky/oe-init-build-env" "$build" >/dev/null
          set -euo pipefail
          cp "$staged/bb-build/conf/local.conf" "$build/conf/local.conf"
          cat >> "$build/conf/local.conf" <<'EOF'
          BB_NO_NETWORK = "1"
          BB_FETCH_PREMIRRORONLY = "1"
          CONNECTIVITY_CHECK_URIS = ""
          # The pinned dstack distro prefers linux-yocto-dev, whose AUTOREV
          # requires network during parsing. These are the recipe's own static
          # parse fallback revisions, not reviewed kernel build inputs.
          SRCREV_machine:pn-linux-yocto-dev = "29594404d7fe73cd80eaa4ee8c43dcc53970c60e"
          SRCREV_meta:pn-linux-yocto-dev = "29594404d7fe73cd80eaa4ee8c43dcc53970c60e"
          EOF
          cat > "$build/conf/bblayers.conf" <<EOF
          POKY_BBLAYERS_CONF_VERSION = "2"
          BBPATH = "\${TOPDIR}"
          BBFILES ?= ""
          BBLAYERS ?= " \\
            $staged/poky/meta \\
            $staged/poky/meta-poky \\
            $staged/poky/meta-yocto-bsp \\
            $staged/meta-confidential-compute \\
            $staged/meta-openembedded/meta-oe \\
            $staged/meta-openembedded/meta-python \\
            $staged/meta-openembedded/meta-networking \\
            $staged/meta-openembedded/meta-filesystems \\
            $staged/meta-virtualization \\
            $staged/meta-rust-bin \\
            $staged/meta-security \\
            $staged/meta-dstack \\
            $staged/meta-nvidia \\
            "
          EOF
          bitbake -p
          bitbake -g dstack-rootfs
          test -s "$build/pn-buildlist"
          test -s "$build/task-depends.dot"
          grep -Fx 'dstack-rootfs' "$build/pn-buildlist" >/dev/null
          echo 'Pinned corrected-guest source with ABI-smoked native binaries parsed and produced a rootfs task dependency graph on native x86_64 Linux. Production kernel revisions, image build, image publication, Phala resource, hardware boot and private approval remain unresolved.' \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Exercise one pinned BitBake worker task under scoped AppArmor permission
        if: ${{ inputs.worker_task_smoke }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1
          source="$GITHUB_WORKSPACE/source"
          scratch="$source/.codex-tmp/phala-bitbake-parse"
          staged="$scratch/candidate/staged-source"
          build="$scratch/build"
          poky="$scratch/sources/poky"
          probe="$source/experiments/ephemeral-runtime/probe-bitbake-worker.py"
          python="$scratch/hosttools/bin/bitbake-python3"
          profile="$scratch/bitbake-python3.apparmor"
          install -m 0555 /usr/bin/python3 "$python"
          cmp -s /usr/bin/python3 "$python"
          [[ "$python" =~ ^/[A-Za-z0-9_./-]+$ ]]
          cat > "$profile" <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          $python flags=(unconfined) {
            userns,
          }
          EOF

          loaded=0
          cleanup() {
            if [[ "$loaded" = 1 ]]; then
              sudo -n apparmor_parser -R "$profile"
            fi
          }
          trap cleanup EXIT
          set +e
          "$python" -I -B "$probe" "$poky" > "$scratch/worker-baseline.json"
          baseline_status=$?
          set -e
          cat "$scratch/worker-baseline.json"
          test "$baseline_status" -ne 0

          loaded=1
          sudo -n apparmor_parser -r "$profile"
          "$python" -I -B "$probe" "$poky" | tee "$scratch/worker-profile.json"
          export PATH="$scratch/hosttools/bin:$PATH"
          set +u
          . "$staged/poky/oe-init-build-env" "$build" >/dev/null
          set -euo pipefail
          set +e
          "$python" "$staged/poky/bitbake/bin/bitbake" -T 0 \
            -c unpack texinfo-dummy-native
          task_status=$?
          "$python" "$staged/poky/bitbake/bin/bitbake" -m
          stop_status=$?
          set -e
          python3 -I - "$python" <<'PY'
          import os
          from pathlib import Path
          import select
          import sys

          executable = sys.argv[1]
          def profiled_processes():
              for process in Path("/proc").iterdir():
                  if not process.name.isdecimal():
                      continue
                  try:
                      if os.readlink(process / "exe") == executable:
                          yield int(process.name)
                  except OSError:
                      pass

          pending = {}
          for pid in profiled_processes():
              try:
                  pending[os.pidfd_open(pid)] = pid
              except ProcessLookupError:
                  pass
          if pending:
              print("Waiting for profiled BitBake processes to exit:",
                    sorted(pending.values()), flush=True)
          poller = select.poll()
          for fd in pending:
              poller.register(fd, select.POLLIN | select.POLLHUP)
          try:
              while pending:
                  for fd, _event in poller.poll():
                      poller.unregister(fd)
                      os.close(fd)
                      del pending[fd]
          finally:
              for fd in pending:
                  os.close(fd)
          if list(profiled_processes()):
              raise SystemExit("BitBake profile still has live Python processes")
          PY

          sudo -n apparmor_parser -R "$profile"
          loaded=0
          trap - EXIT
          test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1
          set +e
          "$python" -I -B "$probe" "$poky" > "$scratch/worker-after-removal.json"
          after_status=$?
          set -e
          cat "$scratch/worker-after-removal.json"
          test "$after_status" -ne 0
          test "$task_status" -eq 0
          test "$stop_status" -eq 0
          echo 'One pinned, local-source BitBake do_unpack task passed with worker namespace isolation under a job-scoped AppArmor profile. The profile was removed and the baseline restriction returned. This did not build a rootfs or image.' \
            >> "$GITHUB_STEP_SUMMARY"
