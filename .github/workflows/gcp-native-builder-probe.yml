name: GCP native x86 builder probe

on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    name: Diagnostic host capability check
    runs-on: ubuntu-24.04
    steps:
      - name: Check architecture, workspace, and namespaces
        shell: bash
        run: |
          set -euo pipefail

          echo "Architecture: $(uname -m)"
          echo "Kernel: $(uname -sr)"
          df -h "$GITHUB_WORKSPACE"
          stat -f -c 'Workspace filesystem: %T' "$GITHUB_WORKSPACE"
          test "$(uname -m)" = x86_64

          scratch="$(mktemp -d "$GITHUB_WORKSPACE/zrpc-builder-probe.XXXXXX")"
          trap 'rm -f -- "$scratch/PAM.7.gz" "$scratch/pam.7.gz"; rmdir -- "$scratch/mount" "$scratch"' EXIT
          printf 'upper' > "$scratch/PAM.7.gz"
          printf 'lower' > "$scratch/pam.7.gz"
          test "$(cat "$scratch/PAM.7.gz")" = upper
          test "$(cat "$scratch/pam.7.gz")" = lower
          echo 'Workspace case sensitivity: passed'

          failed=0
          for namespace in user mount net; do
            case "$namespace" in
              user) args=(--user --map-root-user) ;;
              mount) args=(--user --map-root-user --mount) ;;
              net) args=(--user --map-root-user --net) ;;
            esac
            if unshare "${args[@]}" true; then
              echo "Unprivileged $namespace namespace: passed"
            else
              echo "Unprivileged $namespace namespace: unavailable"
              failed=1
            fi
          done

          parent_mount_ns="$(readlink /proc/self/ns/mnt)"
          parent_net_ns="$(readlink /proc/self/ns/net)"
          parent_pid_ns="$(readlink /proc/self/ns/pid)"
          parent_user_ns="$(readlink /proc/self/ns/user)"
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          mkdir "$scratch/mount"
          if sudo -n unshare --mount --net --pid --fork --mount-proc --propagation private bash -c '
            set -euo pipefail
            test "$(readlink /proc/self/ns/mnt)" != "$2"
            test "$(readlink /proc/self/ns/net)" != "$3"
            test "$(readlink /proc/self/ns/pid)" != "$4"
            test "$(ip -o link show | wc -l)" -eq 1
            ip link show lo > /dev/null
            test -z "$(ip -4 route show)"
            test -z "$(ip -6 route show)"
            mount -t tmpfs tmpfs "$1"
            test "$(stat -f -c %T "$1")" = tmpfs
            umount "$1"
          ' _ "$scratch/mount" "$parent_mount_ns" "$parent_net_ns" "$parent_pid_ns"; then
            echo 'Rootful mount/network/PID namespace smoke check: passed'
          else
            echo 'Rootful mount/network/PID namespace smoke check: unavailable'
          fi

          if sudo -n unshare --user --map-root-user --mount --net --pid --fork \
            --mount-proc --propagation private bash -c '
            set -euo pipefail
            test "$(readlink /proc/self/ns/user)" != "$2"
            test "$(readlink /proc/self/ns/mnt)" != "$3"
            test "$(readlink /proc/self/ns/net)" != "$4"
            test "$(readlink /proc/self/ns/pid)" != "$5"
            test "$(id -u):$(id -g)" = 0:0
            read -r inner outer count < /proc/self/uid_map
            test "$inner:$outer:$count" = 0:0:1
            read -r inner outer count < /proc/self/gid_map
            test "$inner:$outer:$count" = 0:0:1
            test "$(ip -o link show | wc -l)" -eq 1
            test -z "$(ip -4 route show)"
            test -z "$(ip -6 route show)"
            echo "Root-owned UID0-mapped user namespace: passed"

            outer_mount_ns="$(readlink /proc/self/ns/mnt)"
            outer_net_ns="$(readlink /proc/self/ns/net)"
            unshare --mount --net --propagation private bash -c '\''
              set -euo pipefail
              test "$(readlink /proc/self/ns/mnt)" != "$2"
              test "$(readlink /proc/self/ns/net)" != "$3"
              test "$(ip -o link show | wc -l)" -eq 1
              test -z "$(ip -4 route show)"
              test -z "$(ip -6 route show)"
              echo "Nested mount/network namespaces: created"
              mount -t tmpfs tmpfs "$1"
              test "$(stat -f -c %T "$1")" = tmpfs
              umount "$1"
            '\'' _ "$1" "$outer_mount_ns" "$outer_net_ns"
            echo "Nested mount/network namespace smoke check: passed"
          ' _ /tmp "$parent_user_ns" "$parent_mount_ns" \
            "$parent_net_ns" "$parent_pid_ns"; then
            echo 'Root-owned user namespace and nested sandbox capabilities: available'
          else
            echo 'Root-owned user namespace or nested sandbox capabilities: unavailable'
          fi

          if sudo -n unshare --user \
            --map-users="0:${runner_uid}:1" --map-groups="0:${runner_gid}:1" \
            --setuid=0 --setgid=0 --mount --net --pid --fork --mount-proc \
            --propagation private bash -c '
            set -euo pipefail
            test "$(readlink /proc/self/ns/user)" != "$2"
            test "$(readlink /proc/self/ns/mnt)" != "$3"
            test "$(readlink /proc/self/ns/net)" != "$4"
            test "$(readlink /proc/self/ns/pid)" != "$5"
            test "$(id -u)" -eq 0
            test "$(id -g)" -eq 0
            read -r inner outer count < /proc/self/uid_map
            test "$inner:$outer:$count" = "0:$6:1"
            read -r inner outer count < /proc/self/gid_map
            test "$inner:$outer:$count" = "0:$7:1"
            test "$(ip -o link show | wc -l)" -eq 1
            ip link show lo > /dev/null
            test -z "$(ip -4 route show)"
            test -z "$(ip -6 route show)"
            mount -t tmpfs tmpfs "$1"
            test "$(stat -f -c %T "$1")" = tmpfs
            umount "$1"
          ' _ "$scratch/mount" "$parent_user_ns" "$parent_mount_ns" \
            "$parent_net_ns" "$parent_pid_ns" "$runner_uid" "$runner_gid"; then
            echo 'Rootful runner-UID-mapped user namespace smoke check: passed'
          else
            echo 'Rootful runner-UID-mapped user namespace smoke check: unavailable'
          fi

          if [ "$failed" -ne 0 ]; then
            echo 'The current rootless guest-builder path is blocked on this runner.'
            exit 1
          fi
          echo 'Rootless host capability probe passed; no guest image was built or approved.'

  rust_base:
    name: Diagnostic pinned Rust base capability check
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect exact source and pinned native container without Cargo
        shell: bash
        env:
          RUST_IMAGE: rust:1-trixie@sha256:f2a0f2b3529c9bbbf5479d131611451a3cc3956d9a11374d6d4ba96f059c1dce
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          echo 'Diagnostic only: no Cargo fetch/build, guest image, release approval, or private mode.'
          df -B1 "$GITHUB_WORKSPACE"
          grep -E '^Mem(Total|Available):' /proc/meminfo

          source="$GITHUB_WORKSPACE/zrpc-rust-base-source"
          mkdir "$source"
          git -C "$source" init -q
          git -C "$source" fetch -q --no-tags --depth=1 \
            "https://github.com/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          test "$(git -C "$source" rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git -C "$source" show "$GITHUB_SHA:rust-toolchain.toml" > "$source/rust-toolchain.toml"
          git -C "$source" show "$GITHUB_SHA:scripts/gcp-rust-builder-probe.sh" > "$source/probe.sh"
          python3 - "$source/rust-toolchain.toml" <<'PY'
          import pathlib
          import sys
          import tomllib

          toolchain = tomllib.loads(pathlib.Path(sys.argv[1]).read_text())
          if toolchain.get("toolchain", {}).get("channel") != "1.94.1":
              raise SystemExit("selected source lacks the reviewed Rust 1.94.1 pin")
          PY
          sha256sum "$source/rust-toolchain.toml" "$source/probe.sh"

          # Pulling the reviewed OCI digest is the only image network operation.
          # The probe itself has no route, writable image root, source mount, or host environment.
          docker pull --platform linux/amd64 "$RUST_IMAGE"
          image_platform="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$RUST_IMAGE")"
          repo_digests="$(docker image inspect --format '{{json .RepoDigests}}' "$RUST_IMAGE")"
          image_id="$(docker image inspect --format '{{.Id}}' "$RUST_IMAGE")"
          test "$image_platform" = linux/amd64
          case "$repo_digests" in
            *"${RUST_IMAGE##*@}"*) ;;
            *) echo 'Pulled image lacks the reviewed repository digest' >&2; exit 1 ;;
          esac
          printf 'image_platform=%s\nimage_id=%s\nrepo_digests=%s\n' \
            "$image_platform" "$image_id" "$repo_digests"
          df -B1 "$GITHUB_WORKSPACE"

          docker run --rm --interactive --pull=never --platform linux/amd64 --network none \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --user 65534:65534 --tmpfs /tmp:rw,nosuid,nodev,mode=1777 \
            --entrypoint /usr/bin/env "$RUST_IMAGE" -i \
            HOME=/tmp PATH=/usr/local/cargo/bin:/usr/local/bin:/usr/bin:/bin \
            RUSTUP_HOME=/usr/local/rustup CARGO_HOME=/tmp/cargo \
            RUSTUP_AUTO_INSTALL=0 RUSTUP_TOOLCHAIN=1.94.1-x86_64-unknown-linux-gnu \
            CARGO_NET_OFFLINE=true LANG=C LC_ALL=C TZ=UTC \
            /bin/bash -s -- 1.94.1 < "$source/probe.sh" | tee "$source/probe.log"
          for expected in \
            'probe_kind=diagnostic_pinned_rust_base_only' \
            'full_managed_image_verified=false' \
            'cargo_dependency_closure_verified=false' \
            'cargo_fetch_executed=false' \
            'cargo_build_executed=false' \
            'guest_image_built=false' \
            'approved_release=false' \
            'private_mode_approved=false' \
            'hard_prerequisites_for_rust_only_probe=present'; do
            grep -Fx "$expected" "$source/probe.log"
          done
