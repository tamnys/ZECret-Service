name: GCP native x86 Cargo dependency gate

on:
  workflow_dispatch:

permissions: {}

jobs:
  native_cargo:
    name: Live source gates, locked fetch, and networkless double-build receipt
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch exact project source
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          source="$GITHUB_WORKSPACE/source"
          mkdir "$source"
          git -C "$source" init -q
          git -C "$source" fetch -q --no-tags --depth=1 \
            "https://github.com/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          test "$(git -C "$source" rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git -C "$source" checkout -q --detach FETCH_HEAD
          python3 -I - "$source/rust-toolchain.toml" <<'PY'
          from pathlib import Path
          import sys
          import tomllib

          toolchain = tomllib.loads(Path(sys.argv[1]).read_text())
          if toolchain.get("toolchain", {}).get("channel") != "1.94.1":
              raise SystemExit("source lacks the reviewed native Rust toolchain pin")
          PY

      - name: Check both live source policies before any dependency fetch
        shell: bash
        run: |
          set -euo pipefail
          source="$GITHUB_WORKSPACE/source"
          scratch="$GITHUB_WORKSPACE/native-cargo"
          mkdir "$scratch"
          if python3 -I "$source/scripts/check-cargo-registry-age.py" | tee "$scratch/registry-age.json"; then
            registry_status=0
          else
            registry_status=$?
          fi
          if python3 -I "$source/scripts/check-cargo-git-source.py" | tee "$scratch/git-source-age.json"; then
            git_status=0
          else
            git_status=$?
          fi
          if (( registry_status != 0 || git_status != 0 )); then
            echo 'Native Cargo fetch and build refused by live source preflight.' >&2
            exit 1
          fi
          echo 'Both live source preflights passed; no dependency bytes have been fetched.'

      - name: Fetch and inspect the reviewed dstack Git object
        shell: bash
        run: |
          set -euo pipefail
          source="$GITHUB_WORKSPACE/source"
          repository="$GITHUB_WORKSPACE/dstack-source"
          commit=282eeb27d22d8f091ad0fa5a90e638f85cf68751
          mkdir "$repository"
          git -C "$repository" init -q
          git -C "$repository" fetch -q --no-tags --depth=1 \
            https://github.com/Dstack-TEE/dstack "$commit"
          test "$(git -C "$repository" rev-parse FETCH_HEAD)" = "$commit"
          python3 -I "$source/scripts/check-cargo-fetched-git-source.py" \
            "$source" "$repository" | tee "$GITHUB_WORKSPACE/native-cargo/git-object.json"

      - name: Fetch locked Cargo packages with pinned native Rust
        shell: bash
        env:
          RUST_IMAGE: rust:1-trixie@sha256:f2a0f2b3529c9bbbf5479d131611451a3cc3956d9a11374d6d4ba96f059c1dce
        run: |
          set -euo pipefail
          source="$GITHUB_WORKSPACE/source"
          scratch="$GITHUB_WORKSPACE/native-cargo"
          mkdir "$scratch/cargo-home" "$scratch/target"
          test "$(git -C "$source" rev-parse HEAD)" = "$GITHUB_SHA"
          docker pull --platform linux/amd64 "$RUST_IMAGE"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$RUST_IMAGE")" = linux/amd64
          case "$(docker image inspect --format '{{json .RepoDigests}}' "$RUST_IMAGE")" in
            *"${RUST_IMAGE##*@}"*) ;;
            *) echo 'Pinned Rust image digest differs from review' >&2; exit 1 ;;
          esac
          docker run --rm --pull=never --platform linux/amd64 --network bridge \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" --tmpfs /tmp:rw,nosuid,nodev,mode=1777 \
            --mount "type=bind,src=$source,dst=/workspace,readonly" \
            --mount "type=bind,src=$scratch/cargo-home,dst=/cargo-home" \
            --mount "type=bind,src=$scratch/target,dst=/target" \
            --workdir /workspace --entrypoint /usr/bin/env "$RUST_IMAGE" -i \
            HOME=/cargo-home PATH=/usr/local/cargo/bin:/usr/local/bin:/usr/bin:/bin \
            CARGO_HOME=/cargo-home CARGO_TARGET_DIR=/target \
            RUSTUP_HOME=/usr/local/rustup RUSTUP_AUTO_INSTALL=0 \
            RUSTUP_TOOLCHAIN=1.94.1-x86_64-unknown-linux-gnu \
            LANG=C LC_ALL=C TZ=UTC \
            cargo fetch --locked --target x86_64-unknown-linux-gnu
          test "$(git -C "$source" rev-parse HEAD)" = "$GITHUB_SHA"
          git -C "$source" diff --quiet -- Cargo.lock Cargo.toml rust-toolchain.toml
          echo 'Locked native dependency fetch completed; no code built or guest image created.'

      - name: Build and export matching native binaries with no network or source write access
        shell: bash
        env:
          RUST_IMAGE: rust:1-trixie@sha256:f2a0f2b3529c9bbbf5479d131611451a3cc3956d9a11374d6d4ba96f059c1dce
        run: |
          set -euo pipefail
          source="$GITHUB_WORKSPACE/source"
          scratch="$GITHUB_WORKSPACE/native-cargo"
          test "$(git -C "$source" rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir "$source/.codex-tmp" "$scratch/reproduction"
          docker run --rm --pull=never --platform linux/amd64 --network none \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" --tmpfs /tmp:rw,nosuid,nodev,mode=1777 \
            --mount "type=bind,src=$source,dst=/workspace,readonly" \
            --mount "type=bind,src=$scratch/cargo-home,dst=/cargo-home" \
            --mount "type=bind,src=$scratch/reproduction,dst=/workspace/.codex-tmp" \
            --workdir /workspace --entrypoint /usr/bin/env "$RUST_IMAGE" -i \
            HOME=/cargo-home PATH=/usr/local/cargo/bin:/usr/local/bin:/usr/bin:/bin \
            CARGO_HOME=/cargo-home CARGO_NET_OFFLINE=true \
            RUSTUP_HOME=/usr/local/rustup RUSTUP_AUTO_INSTALL=0 \
            RUSTUP_TOOLCHAIN=1.94.1-x86_64-unknown-linux-gnu \
            LANG=C LC_ALL=C TZ=UTC \
            sh -ceu '
              command -v python3
              python3 -I scripts/reproduce-release.py \
                --revision "$1" \
                --output-directory "/workspace/.codex-tmp/release-$1"
              python3 -I tools/gcp-guest/export_rust_inputs.py \
                --bundle "/workspace/.codex-tmp/release-$1" \
                --revision "$1" \
                --output "/workspace/.codex-tmp/rust-inputs-$1"
            ' sh "$GITHUB_SHA"
          test "$(git -C "$source" rev-parse HEAD)" = "$GITHUB_SHA"
          git -C "$source" diff --quiet -- Cargo.lock Cargo.toml rust-toolchain.toml

      - name: Exercise the exact native import producer on synthetic media
        shell: bash
        env:
          RUST_IMAGE: rust:1-trixie@sha256:f2a0f2b3529c9bbbf5479d131611451a3cc3956d9a11374d6d4ba96f059c1dce
        run: |
          set -euo pipefail
          source="$GITHUB_WORKSPACE/source"
          scratch="$GITHUB_WORKSPACE/native-cargo"
          test "$(git -C "$source" rev-parse HEAD)" = "$GITHUB_SHA"
          test ! -e "$scratch/reproduction/import-smoke"
          docker run --rm --pull=never --platform linux/amd64 --network none \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" --tmpfs /tmp:rw,nosuid,nodev,mode=1777 \
            --mount "type=bind,src=$source,dst=/workspace,readonly" \
            --mount "type=bind,src=$scratch/reproduction,dst=/workspace/.codex-tmp" \
            --workdir /workspace --entrypoint /usr/bin/env "$RUST_IMAGE" -i \
            HOME=/nonexistent PATH=/usr/bin:/bin LANG=C LC_ALL=C TZ=UTC \
            sh -ceu '
              ulimit -c 0
              smoke=/workspace/.codex-tmp/import-smoke
              release="/workspace/.codex-tmp/release-$1"
              mkdir "$smoke"
              cp "$release/artifacts/zrpc-gcp-lifecycle" "$smoke/producer"
              chmod 0500 "$smoke/producer"
              # The import contract requires a whole-GiB disk; this one is only zeros.
              truncate -s 1073741824 "$smoke/disk.raw"
              "$smoke/producer" pack-import \
                --raw "$smoke/disk.raw" --archive "$smoke/disk.tar.gz" \
                > "$smoke/receipt.json"
            ' sh "$GITHUB_SHA"
          python3 -I - "$scratch/reproduction/release-$GITHUB_SHA/manifest.json" \
            "$scratch/reproduction/import-smoke" "$GITHUB_SHA" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys

          manifest_path, smoke = map(Path, sys.argv[1:3])
          revision = sys.argv[3]
          def digest(path):
              with path.open("rb") as stream:
                  return hashlib.file_digest(stream, "sha256").hexdigest()
          manifest = json.loads(manifest_path.read_bytes())
          receipt = json.loads((smoke / "receipt.json").read_bytes())
          binary_sha256 = digest(smoke / "producer")
          if (manifest.get("source_commit") != revision
                  or manifest.get("reproducible") is not True
                  or manifest.get("artifact_sha256", {}).get("zrpc-gcp-lifecycle") != binary_sha256):
              raise ValueError("native import producer differs from matched build")
          expected = {
              "schema_version": 2,
              "producer": "zrpc-gcp-lifecycle-rust",
              "producer_executable_sha256": binary_sha256,
              "archive_sha256": digest(smoke / "disk.tar.gz"),
              "raw_disk_sha256": digest(smoke / "disk.raw"),
              "raw_disk_bytes": 1073741824,
              "oldgnu_single_member_checked": True,
              "private_mode_approved": False,
              "toolchain_reviewed": False,
          }
          if receipt != expected:
              raise ValueError("native import receipt differs from synthetic media or binary")
          print(json.dumps({"status": "diagnostic-native-import-producer-exercised",
                            "source_commit": revision, "producer_sha256": binary_sha256,
                            "private_mode_approved": False}, sort_keys=True))
          PY
          test "$(git -C "$source" rev-parse HEAD)" = "$GITHUB_SHA"
          git -C "$source" diff --quiet

      - name: Probe a static native import producer in an empty-root container
        shell: bash
        env:
          RUST_IMAGE: rust:1-trixie@sha256:f2a0f2b3529c9bbbf5479d131611451a3cc3956d9a11374d6d4ba96f059c1dce
        run: |
          set -euo pipefail
          source="$GITHUB_WORKSPACE/source"
          scratch="$GITHUB_WORKSPACE/native-cargo"
          probe="$scratch/static-producer-probe"
          mkdir "$probe" "$scratch/static-target" "$probe/smoke"
          test "$(git -C "$source" rev-parse HEAD)" = "$GITHUB_SHA"
          docker run --rm --pull=never --platform linux/amd64 --network none \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" --tmpfs /tmp:rw,nosuid,nodev,mode=1777 \
            --mount "type=bind,src=$source,dst=/workspace,readonly" \
            --mount "type=bind,src=$scratch/cargo-home,dst=/cargo-home" \
            --mount "type=bind,src=$scratch/static-target,dst=/target" \
            --mount "type=bind,src=$probe,dst=/output" \
            --workdir /workspace --entrypoint /usr/bin/env "$RUST_IMAGE" -i \
            HOME=/cargo-home PATH=/usr/local/cargo/bin:/usr/local/bin:/usr/bin:/bin \
            CARGO_HOME=/cargo-home CARGO_TARGET_DIR=/target CARGO_NET_OFFLINE=true \
            RUSTUP_HOME=/usr/local/rustup RUSTUP_AUTO_INSTALL=0 \
            RUSTUP_TOOLCHAIN=1.94.1-x86_64-unknown-linux-gnu \
            LANG=C LC_ALL=C TZ=UTC \
            sh -ceu '
              ulimit -c 0
              test -f /usr/lib/x86_64-linux-gnu/libc.a
              test -f /usr/lib/x86_64-linux-gnu/libm.a
              cargo rustc --locked --offline --release -p zrpc-lifecycle \
                --bin zrpc-gcp-lifecycle -- -C target-feature=+crt-static
              cp /target/release/zrpc-gcp-lifecycle /output/producer
              chmod 0555 /output/producer
              if readelf -l /output/producer | grep -q INTERP; then
                echo "static producer retained an ELF interpreter" >&2; exit 1
              fi
              if readelf -d /output/producer | grep -q NEEDED; then
                echo "static producer retained a shared-library dependency" >&2; exit 1
              fi
              sha256sum /usr/lib/x86_64-linux-gnu/libc.a \
                /usr/lib/x86_64-linux-gnu/libm.a > /output/static-libraries.sha256
            '
          cat > "$probe/Dockerfile" <<'EOF'
          FROM scratch
          COPY producer /producer
          ENTRYPOINT ["/producer"]
          EOF
          image="zrpc-static-import-probe:$GITHUB_SHA"
          docker build --network none --pull=false -q -t "$image" "$probe"
          truncate -s 1073741824 "$probe/smoke/disk.raw"
          docker run --rm --pull=never --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$probe/smoke,dst=/workspace" \
            --workdir /workspace "$image" pack-import \
              --raw /workspace/disk.raw --archive /workspace/disk.tar.gz \
              > "$probe/smoke/receipt.json"
          python3 -I - "$probe" "$GITHUB_SHA" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys

          probe = Path(sys.argv[1])
          revision = sys.argv[2]
          def digest(path):
              with path.open("rb") as stream:
                  return hashlib.file_digest(stream, "sha256").hexdigest()
          receipt = json.loads((probe / "smoke/receipt.json").read_bytes())
          producer = digest(probe / "producer")
          expected = {
              "schema_version": 2,
              "producer": "zrpc-gcp-lifecycle-rust",
              "producer_executable_sha256": producer,
              "archive_sha256": digest(probe / "smoke/disk.tar.gz"),
              "raw_disk_sha256": digest(probe / "smoke/disk.raw"),
              "raw_disk_bytes": 1073741824,
              "oldgnu_single_member_checked": True,
              "private_mode_approved": False,
              "toolchain_reviewed": False,
          }
          if receipt != expected:
              raise ValueError("static producer receipt differs from synthetic media or binary")
          libraries = {}
          for line in (probe / "static-libraries.sha256").read_text().splitlines():
              value, path = line.split(maxsplit=1)
              if path not in ("/usr/lib/x86_64-linux-gnu/libc.a",
                              "/usr/lib/x86_64-linux-gnu/libm.a"):
                  raise ValueError("unexpected static library identity")
              libraries[path] = value
          if len(libraries) != 2:
              raise ValueError("static library identities are incomplete")
          report = {
              "schema_version": 1,
              "status": "diagnostic-static-import-producer-probe",
              "source_commit": revision,
              "producer_sha256": producer,
              "static_library_sha256": libraries,
              "no_elf_interpreter": True,
              "no_shared_library_dependency": True,
              "empty_root_pack_import_passed": True,
              "reproducible": False,
              "private_mode_approved": False,
          }
          (probe / "diagnostic.json").write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
          print(json.dumps(report, sort_keys=True))
          PY
          test "$(git -C "$source" rev-parse HEAD)" = "$GITHUB_SHA"
          git -C "$source" diff --quiet

      - name: Package and verify the matched-build bundle
        shell: bash
        run: |
          set -euo pipefail
          source="$GITHUB_WORKSPACE/source"
          scratch="$GITHUB_WORKSPACE/native-cargo"
          release="$scratch/reproduction/release-$GITHUB_SHA"
          bundle="$scratch/review-bundle"
          mkdir "$bundle"
          python3 -I - "$source" "$release" "$bundle" "$scratch/reproduction/rust-inputs-$GITHUB_SHA" "$GITHUB_SHA" <<'PY'
          import importlib.util
          import json
          from pathlib import Path
          import shutil
          import sys

          source, release, bundle, guest_inputs = map(Path, sys.argv[1:5])
          revision = sys.argv[5]
          spec = importlib.util.spec_from_file_location(
              "export_rust_inputs", source / "tools/gcp-guest/export_rust_inputs.py")
          exporter = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(exporter)
          exporter.inspect(release, revision)
          manifest = json.loads((release / "manifest.json").read_text())
          names = sorted(manifest["artifact_sha256"])
          gates = bundle / "dependency-gates"
          gates.mkdir()
          for name, passed in (("registry-age.json", "registry_preflight_passed"),
                               ("git-source-age.json", "git_source_metadata_preflight_passed"),
                               ("git-object.json", "git_object_fetched_and_checked_locally")):
              path = release.parents[1] / name
              report = json.loads(path.read_text())
              if report.get(passed) is not True or report.get("cargo_lock_sha256") != manifest["input_sha256"]["Cargo.lock"]:
                  raise ValueError("dependency gate receipt differs from matched build")
              shutil.copy2(path, gates / name)
          for name in ("manifest.json", "SHA256SUMS", "source.tar"):
              shutil.copy2(release / name, bundle / name)
          for name in names:
              for directory in ("artifacts", "build-a/target/release", "build-b/target/release"):
                  target = bundle / directory / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(release / directory / name, target)
          probe = release.parents[1] / "static-producer-probe"
          diagnostic = bundle / "diagnostic-static-producer"
          diagnostic.mkdir()
          for name in ("producer", "diagnostic.json", "static-libraries.sha256"):
              shutil.copy2(probe / name, diagnostic / name)
          shutil.copytree(guest_inputs, bundle / "guest-inputs")
          exporter.inspect(bundle, revision)
          PY
          tar -C "$bundle" -cf "$scratch/native-rust-$GITHUB_SHA.tar" .
          (cd "$scratch" && sha256sum "native-rust-$GITHUB_SHA.tar" > "native-rust-$GITHUB_SHA.tar.sha256")

      - name: Upload the reviewable unsigned receipt
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-rust-${{ github.sha }}
          path: |
            ${{ github.workspace }}/native-cargo/native-rust-${{ github.sha }}.tar
            ${{ github.workspace }}/native-cargo/native-rust-${{ github.sha }}.tar.sha256
          if-no-files-found: error

      - name: Record uploaded receipt digests
        shell: bash
        run: |
          set -euo pipefail
          echo "Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Bundle SHA-256: $(cut -d ' ' -f 1 "$GITHUB_WORKSPACE/native-cargo/native-rust-$GITHUB_SHA.tar.sha256")" >> "$GITHUB_STEP_SUMMARY"
          echo 'Artifact SHA-256: ${{ steps.upload.outputs.artifact-digest }}' >> "$GITHUB_STEP_SUMMARY"
