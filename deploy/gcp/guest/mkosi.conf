# Source candidate: tools/gcp-guest/prepare.py refuses unresolved input locks.
[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64
RepositoryKeyCheck=yes
RepositoryKeyFetch=no

[Output]
Format=disk
Output=zrpc-gcp
ManifestFormat=json
RepartDirectories=repart
SectorSize=512

[Config]
Dependencies=initrd

[Content]
# Package closure and authenticated snapshot are supplied by the locked inputs.
Bootable=yes
Bootloader=uki
BiosBootloader=none
ShimBootloader=none
UnifiedKernelImages=yes
KernelModulesInitrd=yes
KernelModulesInitrdInclude=^drivers/md/dm-verity[.]ko[.]xz$
KernelModulesInitrdExclude=.*
Autologin=no
Ssh=no
KernelCommandLine=ro systemd.gpt_auto=0 rd.systemd.gpt_auto=0 rd.modules_load=dm-verity systemd.import_credentials=no systemd.unit=zrpc.target systemd.crash_shell=0 systemd.crash_action=poweroff systemd.dump_core=0 systemd.mask=debug-shell.service systemd.mask=ctrl-alt-del.target systemd.mask=systemd-hibernate.service systemd.mask=systemd-hybrid-sleep.service systemd.mask=systemd-suspend-then-hibernate.service pstore.backend=none panic=-1 oops=panic module.sig_enforce=1 lockdown=confidentiality
ExtraTrees=rootfs
# Package scripts and APT databases are build-time inputs only. The pinned
# mkosi cleanup runs after package configuration and before rootfs sealing.
CleanPackageMetadata=yes
# These pinned Debian package files gain setuid/setgid bits in their archive
# modes or the signed dbus postinst. The appliance units do not use them.
# Systemd needs mount(8); a source-bound finalizer strips its privilege bits
# before the final rootfs audit. Other privileged helpers stay absent.
RemoveFiles=/usr/sbin/unix_chkpwd,/usr/bin/umount,/usr/bin/su,/usr/sbin/losetup,/usr/sbin/swapon,/usr/sbin/swapoff,/usr/lib/dbus-1.0/dbus-daemon-launch-helper,/var/cache/ldconfig/aux-cache,/var/log/alternatives.log,/opt,/usr/local,/etc/opt,/etc/systemd/system/getty.target.wants,/etc/systemd/system/sysinit.target.wants,/etc/systemd/system/systemd-journald.service.wants,/etc/systemd/system/timers.target.wants,/etc/systemd/user,/etc/systemd/system/ctrl-alt-del.target,/etc/systemd/system/sockets.target.wants/systemd-journald-audit.socket,/etc/systemd/system/sockets.target.wants/systemd-pcrextend.socket,/etc/alternatives,/usr/bin/awk,/usr/bin/nawk,/usr/bin/mt,/usr/sbin/rmt,/usr/bin/pager,/usr/bin/which

[Validation]
SecureBoot=yes
SecureBootAutoEnroll=no
SignExpectedPcr=no
Checksum=yes

[Build]
WithNetwork=no
CacheOnly=always
Incremental=no
