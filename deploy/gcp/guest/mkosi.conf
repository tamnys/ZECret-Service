# Source candidate: tools/gcp-guest/prepare.py refuses unresolved input locks.
[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64
RepositoryKeyCheck=yes
RepositoryKeyFetch=no

[Output]
Format=disk
Output=zrpc-gcp
ManifestFormat=json
RepartDirectories=repart

[Content]
# Package closure and authenticated snapshot are supplied by the locked inputs.
Bootable=yes
Bootloader=uki
BiosBootloader=none
ShimBootloader=none
UnifiedKernelImages=yes
Autologin=no
Ssh=no
KernelCommandLine=ro systemd.gpt_auto=0 rd.systemd.gpt_auto=0 systemd.unit=zrpc.target rd.emergency=reboot rd.shell=0 systemd.mask=debug-shell.service systemd.mask=systemd-hibernate.service systemd.mask=systemd-hybrid-sleep.service systemd.mask=systemd-suspend-then-hibernate.service panic=-1 oops=panic module.sig_enforce=1 lockdown=confidentiality
ExtraTrees=rootfs

[Validation]
SecureBoot=yes
SecureBootAutoEnroll=no
SignExpectedPcr=no
Checksum=yes

[Build]
WithNetwork=no
CacheOnly=always
Incremental=no
