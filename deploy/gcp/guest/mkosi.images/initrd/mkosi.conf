# Source policy for a systemd initrd. Exact Debian package versions are
# appended by prepare.py only after the signed snapshot has been checked.
# This intentionally does not include mkosi-initrd's broad package/module list.
[Output]
Format=cpio
Output=initrd
ManifestFormat=json
CompressOutput=zstd

[Content]
Bootable=no
MakeInitrd=yes
Autologin=no
Ssh=no
CleanPackageMetadata=yes
WithDocs=no
RemoveFiles=/usr/lib/systemd/system/rescue.service,/usr/lib/systemd/system/rescue.target,/usr/lib/systemd/system/emergency.service,/usr/lib/systemd/system/emergency.target,/usr/lib/systemd/system/debug-shell.service,/usr/lib/systemd/system/getty.target,/usr/lib/systemd/system/getty@.service,/etc/systemd/system/getty.target.wants/getty@tty1.service,/usr/lib/systemd/system/autovt@.service,/usr/lib/systemd/system/serial-getty@.service,/usr/lib/systemd/system/console-getty.service,/usr/lib/systemd/system/container-getty@.service,/usr/lib/systemd/system/multi-user.target.wants/getty.target,/usr/lib/systemd/system/runlevel1.target,/usr/lib/systemd/systemd-sulogin-shell,/boot/loader,/etc/ssh,/usr/lib/tmpfiles.d/20-systemd-ssh-generator.conf,/usr/bin/bash,/usr/bin/dash,/usr/bin/sh,/usr/sbin/sulogin,/usr/bin/login,/usr/bin/su
