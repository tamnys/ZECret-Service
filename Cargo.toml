[workspace]
resolver = "2"
members = ["crates/protocol", "crates/verifier", "crates/transport", "crates/client", "crates/server", "crates/lifecycle", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
axum = { version = "=0.8.6", default-features = false, features = ["http1", "tokio", "json"] }
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "macros", "net", "signal"] }
getrandom = "=0.3.4"
