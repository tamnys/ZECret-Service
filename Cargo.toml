[workspace]
resolver = "2"
members = ["crates/protocol", "crates/verifier", "crates/transport", "crates/client", "crates/server", "crates/lifecycle", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
axum = { version = "=0.8.6", default-features = false, features = ["http1", "tokio", "json"] }
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "macros", "net", "signal", "io-util"] }
getrandom = "=0.3.4"
tokio-socks = { version = "=0.5.3", default-features = false, features = ["tokio"] }

# Maintained dstack runtime-event encoding/replay, pinned to the catalog OS source.
cc-eventlog = { git = "https://github.com/Dstack-TEE/dstack", rev = "282eeb27d22d8f091ad0fa5a90e638f85cf68751", version = "=0.5.9" }
ez-hash = "=1.1.0"
hex = "=0.4.3"

# Offline quote verification only: no PCCS/HTTP fetch or permissive TCB override.
dcap-qvl = { version = "=0.6.3", default-features = false, features = ["std", "ring", "default-x509"] }
parity-scale-codec = { version = "=3.7.5", default-features = false, features = ["std"] }
